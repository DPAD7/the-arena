            face = document.createElement("b");
            face.className = "h2hchip";
            (tick.parentNode || h).appendChild(face);
            var oldFace = h.querySelector(".h2hface"), oldLead = h.querySelector(".h2hlead");
            if (oldFace) oldFace.remove();
            if (oldLead) oldLead.remove();
          }
          /* the man on the left leads leftward from the zero, the man on the
             right leads rightward — it was drawing each lead into the other
             man's half */
          /* the club in front colours the bar */
          var clubs = card.querySelectorAll(".ghead .glogo");
          var leftClub = clubs[0] ? clubs[0].getAttribute("alt") : "";
          var rightClub = clubs[1] ? clubs[1].getAttribute("alt") : "";
          var hue = gap > 0 ? clubHue(leftClub) : clubHue(rightClub);
          if (gap > 0) {
            fill.style.left = (50 - half) + "%"; fill.style.width = half + "%";
            fill.style.background = hue || GOLD; tick.style.left = (50 - half) + "%";
          } else if (gap < 0) {
            fill.style.left = "50%"; fill.style.width = half + "%";
            fill.style.background = hue || BLUE; tick.style.left = (50 + half) + "%";
          } else {
            fill.style.left = "50%"; fill.style.width = "0"; tick.style.left = "50%";
          }
          /* whoever is in front, at the edge of his own fill */
          var lead = gap > 0 ? card.dataset.lqbid : (gap < 0 ? card.dataset.rqbid : "");
          if (lead) {
            face.textContent = "+" + Math.abs(gap);
            face.style.color = readable(hue) || (gap > 0 ? GOLD : BLUE);

               beside it. It is held far enough in to stay on the track. */
            var bar = h.querySelector(".h2hbar");
            var edge = bar && bar.offsetWidth
                     ? (20 / bar.offsetWidth) * 100 : 13;
            var at = parseFloat(tick.style.left);
            if (isNaN(at)) at = 50;
            var held = Math.min(100 - edge, Math.max(edge, at));
            face.style.left = held + "%";
            /* the tick would otherwise stick out past a held-back face */

          } else {

            face.textContent = "";
            tick.style.opacity = "";
          }
          tick.querySelector("b").textContent = "";
          var foot = h.querySelectorAll(".h2hrow .trkbox");
          foot[0].textContent = lv;
          foot[1].textContent = rv;
          foot[0].classList.toggle("hit", gap > 0);
          foot[1].classList.toggle("hit", gap < 0);
        }


        /* the combined passing section, where one exists */
        card.querySelectorAll(".grow").forEach(function (r) {
          var lab = r.querySelector(".gmk");
          if (!lab || lab.textContent.trim() !== "1+ REC 1Q") return;
          r.querySelectorAll(".gcell").forEach(function (cellSide, ci) {
            cellSide.querySelectorAll(".recman").forEach(function (man) {
              var nm = man.querySelector(".wrname");
              if (!nm) return;
              var written = nm.textContent.replace(/[\u2713\u2715]/g, "").trim();
              var caught = man.dataset.pid ? recCount[man.dataset.pid] : undefined;
              if (caught === undefined) caught = recCount[written];
              if (caught === null || caught === undefined) return;
              stamp(nm, caught >= 1 ? true : (firstOver ? false : null), ci === 1);
            });

        });

        card.querySelectorAll(".ptdx").forEach(function (ptd) {
          var scale = parseFloat(ptd.dataset.scale) || 4;
          var over = parseInt(ptd.dataset.need, 10) || 2;
          var kind = ptd.dataset.kind || "PTD";
          [["l", 0], ["r", 1]].forEach(function (sd) {
            var mine = stats[sd[0]];
            var pane = ptd.querySelector(".ptdside--" + sd[0]);
            if (!pane) return;
            if (!mine) { if (!done) return; mine = {}; }
            var v = kind === "ATD" ? mine.td : mine.ptd;
            /* A man who never carried the ball has no rushing line at all, and
               that was read as "not known yet" and left grey. On a finished
               game it is a nought, and a nought is red. Cooper Rush and Kyler
               Murray sat grey for it. (Jose, Sep 17, 2026) */
            if (v === null || v === undefined || isNaN(v)) {
              if (!done) return;

            }
            /* the football sample has no bar to fill */
            var fill = pane.querySelector(".ptdfill");
            if (fill) {

            }
            /* A way into the highlights, one per touchdown he actually threw:

          pane.querySelectorAll(".ptdbtn").forEach(function (btn) {
            var line = btn.querySelector(".ptdline");
            var need = line ? parseInt(line.textContent, 10) : NaN;
            var had = btn.querySelector(".ptdplay");
            /* No clip, no button. The summary already carries the scoring
               plays and the clip list, so whether THIS touchdown has one can
               be answered here without asking for anything more. */
            var pool = (card._clips || []).filter(function (c) {
              return ONEPLAY[(c.tracking || {}).coverageType] &&
                     ((c.links || {}).source || {}).href;
            });
            var mine = [];
            var whom = surnameKey(sd[0] === "l" ? card.dataset.lqb : card.dataset.rqb);
            (card._scoring || []).forEach(function (p) {
              var t = scoreLine(p.text, whom, kind);
              if (t) mine.push(t);
            });
            var td = mine[need - 1];
            var ord = { first: 1, "1st": 1, second: 2, "2nd": 2,
                        third: 3, "3rd": 3, fourth: 4, "4th": 4 };
            var any = !!(td && (nflRow(card.dataset.espn, td.text) ||
                                xRow(card.dataset.espn, td.text) ||
                                clubRow(card.dataset.espn, td.text) || pool.some(function (c) {
              var h = (c.headline || "").toLowerCase();
              if (h.indexOf(td.man) >= 0) return true;
              /* a clip writes him as the broadcast says him -- "Pat Mahomes",
                 not "Patrick" -- so a rushing score matches on the surname and
                 the word for the run (Jose, Sep 17, 2026) */
              if (td.run && h.indexOf(surnameKey(td.scorer)) >= 0 &&
                  /\brush|\brun|\bscramble|\bkeeper/.test(h)) return true;
              if (h.indexOf(td.qb) >= 0 &&
                  new RegExp("\\b" + td.yds + "\\b").test(h)) return true;
              if (h.indexOf(td.qb) < 0) return false;
              var o = /\b(first|1st|second|2nd|third|3rd|fourth|4th)\b[^.]{0,18}\btd\b/.exec(h);
              return !!o && ord[o[1]] === need;
            })));
            btn.dataset.why = pane.dataset.why = isNaN(need) ? "no need" : !(v >= need) ? "count " + v + " < " + need
              : !td ? "no play #" + need + " of " + mine.length + " (scoring " + ((card._scoring || []).length) + ")"
              : !any ? "no clip for " + td.text.slice(0, 30) + " (pool " + pool.length + ", x " + (xRow(card.dataset.espn, td.text) ? 1 : 0) + ")"
              : !covered(card, sd[0]) ? "not covered (" + (CFBCOVER ? "list" : "no list") + ")" : "ok";
            var ballEl = btn.querySelector(".ntick.ball");
            if (isNaN(need) || !(v >= need) || !any || !covered(card, sd[0])) {
              if (had) had.parentNode.removeChild(had);
              if (ballEl) ballEl.classList.remove("ball--clip");
              return;
            }
            if (had) return;
            /* the ball is the clip: it gets a ring and a tap on it plays. The
               button below still exists (hidden) and does the work. (Jose, Sep 16, 2026) */
            if (ballEl && !ptd.classList.contains("ptdx--run")) ballEl.classList.add("ball--clip");
            var go = document.createElement("button");
            go.className = "ptdplay";
            go.type = "button";
            go.setAttribute("aria-label", "Game highlights");
            go.innerHTML = '<svg aria-hidden="true"><use href="#play"/></svg>';
            go.addEventListener("click", function (e) {
              e.preventDefault();

              var qb = sd[0] === "l" ? card.dataset.lqb : card.dataset.rqb;

            if (chip) {

            var tk = pane.querySelector(".tick");

              var need = parseInt(ln0.textContent, 10);
              var cell = b.querySelector(".price") ? b : null;
              if (!cell) return;
              var old = b.querySelector(".mk");
              if (old) old.parentNode.removeChild(old);
              var hit = v >= need ? true : (done ? false : null);
              var line = b.querySelector(".ptdline");
              /* in the second cut the bar's own numbers carry the result */
              if (second) return;
              if (hit === null) return;
              var m = document.createElement("span");
              m.className = "mk " + (hit ? "ok" : "no");
              m.innerHTML = hit ? CHECK : CROSS;
              line.appendChild(m);
            });

         now" -- Mahomes leading 9-0 in the first is not a card that paid.
         Nothing has paid until the game is over. */
      if (done) {

      } else {
        var hbox = card.querySelector(".hits");
        if (hbox) { hbox.hidden = true; hbox.innerHTML = ""; }
      }
        var clubs = card.querySelectorAll(".gteam");
        if (clubs.length === 2 && done && lside && rside) {
          stamp(clubs[0], lside.winner === true, false);

         ["ATD", 1, "td"], ["2+ TDS", 2, "td"]].forEach(function (spec) {
          var cells = rowCells(card, spec[0]);
          if (!cells) return;
          [["l", 0], ["r", 1]].forEach(function (side) {
            var mine = stats[side[0]];
            if (!mine) return;
            var v = mine[spec[2]];
            if (v === null || v === undefined || isNaN(v)) return;
            if (v >= spec[1]) mark(cells[side[1]], true);

  }

  /* Reading the graph: the nearest play to the finger, from whatever the
     live pass last fetched. A chart with no series yet simply does nothing. */
  function wireRead(card) {
    var svg = card.querySelector(".wpx > svg");
    if (!svg || svg.dataset.wired) return;
    svg.dataset.wired = "1";
    var cur = document.createElementNS("http://www.w3.org/2000/svg", "line");
    cur.setAttribute("stroke", "#ffffff");
    cur.setAttribute("stroke-width", "1");
    cur.setAttribute("vector-effect", "non-scaling-stroke");
    cur.setAttribute("y1", "0");
    cur.setAttribute("y2", "110");
    cur.style.display = "none";
    var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("r", "4");
    dot.setAttribute("fill", "#ffffff");
    dot.style.display = "none";
    svg.appendChild(cur);
    svg.appendChild(dot);
    var play = document.createElement("div");
    play.className = "wpplay";
    svg.parentNode.parentNode.insertBefore(play, svg.parentNode.nextSibling);

    function read(ev) {
      var pts = card._wp;
      if (!pts || !pts.length) return;
      var r = svg.getBoundingClientRect();
      var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      var x = Math.max(0, Math.min(300, cx / r.width * 300));
      var near = pts[0];
      pts.forEach(function (p) { if (Math.abs(p.x - x) < Math.abs(near.x - x)) near = p; });
      cur.setAttribute("x1", near.x);
      cur.setAttribute("x2", near.x);
      cur.style.display = "";
      dot.setAttribute("cx", near.x);
      dot.setAttribute("cy", near.y);
      dot.style.display = "";
      var reads = card.querySelectorAll(".wpbig");
      if (reads.length === 2) {
        reads[0].textContent = near.l.toFixed(1) + "%";
        reads[1].textContent = (100 - near.l).toFixed(1) + "%";
      }
      play.innerHTML = near.t
        ? "<b>" + (near.q ? "Q" + near.q + " " : "") + (near.c || "") + "</b> " +
          (near.d ? "· " + near.d + " " : "") + "<br>" + near.t
        : "";
      if (ev.cancelable) ev.preventDefault();
    }
    svg.addEventListener("pointermove", read);
    svg.addEventListener("pointerdown", read);
    svg.addEventListener("pointerleave", function () {
      cur.style.display = "none";
      dot.style.display = "none";
      play.innerHTML = "";
      if (card._last !== undefined) {
        var reads = card.querySelectorAll(".wpbig");
        if (reads.length === 2) {
          reads[0].textContent = card._last.toFixed(1) + "%";
          reads[1].textContent = (100 - card._last).toFixed(1) + "%";
        }
      }
    });
  }

  /* ---- Boxing, entered by hand ----
     ESPN publishes no boxing API at all — every endpoint returns nothing or
     an error — so a major fight is settled from a result written here when it
     happens. Winner is a surname, method is KO / SUB / DEC. */
  var BOXING = {
    "garcia-benn": { winner: "Garcia", method: "KO", round: 2 }
  };

  function settleBoxing() {
    document.querySelectorAll(".gcard[data-fight]").forEach(function (card) {
      var r = BOXING[card.dataset.fight];
      if (!r || !r.winner) return;
      card.classList.add("locked");
      card.querySelectorAll("button.price").forEach(function (b) { shutPrice(b); });
      settleFight(card, r.winner, r.method);
    });
  }

  /* ---- The fights, off ESPN's MMA board ----
     One request covers every bout on the card. A finished bout gives the
     winner in competitors[].winner and how he won in details[], written
     "Unofficial Winner Decision" / "Kotko" / "Submission". */
  var MMA = "https://site.web.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard";

  function wonBy(how, market) {
    var k = (how || "").toLowerCase();
    var ko = k.indexOf("ko") === 0 || k.indexOf("tko") >= 0;
    var sub = k.indexOf("sub") >= 0;
    var dec = k.indexOf("dec") >= 0;
    if (market === "KO") return ko;
    if (market === "SUB") return sub;
    if (market === "DEC") return dec;
    if (market === "FIN") return ko || sub;
    if (market === "DEC/SUB") return dec || sub;
    if (market === "KO/SUB") return ko || sub;
    return null;
  }

  function surname(n) {
    return (n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .trim().split(" ").pop().toLowerCase();
  }

  function settleFight(card, winner, how) {
    var lf = surname(card.dataset.lf), rf = surname(card.dataset.rf);
    var w = surname(winner);
    var leftWon = w && w === lf, rightWon = w && w === rf;
    var drawn = !w && /draw/i.test(how || ""), nc = !w && /no contest/i.test(how || "");

    var clubs = card.querySelectorAll(".ghead .gteam");
    if (clubs.length === 2) {
      stamp(clubs[0], nc ? "nc" : drawn ? "draw" : leftWon, false);
      stamp(clubs[1], nc ? "nc" : drawn ? "draw" : rightWon, true);
    }
    card.querySelectorAll(".grow").forEach(function (row) {
      var lab = row.querySelector(".gmk");
      if (!lab) return;
      var by = wonBy(how, lab.textContent.trim());
      if (by === null) return;
      var cells = row.querySelectorAll(".gcell");
      if (cells[0]) mark(cells[0], !!(leftWon && by));
      if (cells[1]) mark(cells[1], !!(rightWon && by));
    });
  }

  /* the sheet's method rows: every price the result paid turns green.
     how: theScore's words ("Unanimous Decision", "Submission", "KO/TKO")
     or ESPN's ("Kotko", "Decision"); a draw or no contest pays nothing.
     The round and the clock settle the rest -- which round it ended in, and
     whether it ended inside the first minute or the last ten seconds of a
     round (Jose, Sep 18, 2026). */
  function paidMethods(card, winner, how, round, clock) {
    var k = (how || "").toLowerCase();
    var ko = k.indexOf("ko") >= 0 || k.indexOf("knockout") >= 0;
    var sub = k.indexOf("sub") >= 0;
    var dec = k.indexOf("dec") >= 0 || k === "ud" || k === "md" || k === "sd";
    var ud = dec && (k.indexOf("unanimous") >= 0 || k === "ud");
    var sdmd = dec && (k.indexOf("split") >= 0 || k.indexOf("majority") >= 0 || k === "sd" || k === "md");
    var rn = parseInt(round, 10) || 0;
    /* the clock reads as time elapsed in the round: 0:47 is inside the first
       minute, 4:55 is inside the last ten seconds */
    var secs = -1, mm = /^(\d+):(\d\d)$/.exec(String(clock || "").trim());
    if (mm) secs = parseInt(mm[1], 10) * 60 + parseInt(mm[2], 10);
    var fin = ko || sub;
    var w = surname(winner);
    var side = w && w === surname(card.dataset.lf) ? 0 : w && w === surname(card.dataset.rf) ? 1 : -1;
    var MAN = { ko: ko, sub: sub, dec: dec, kosub: fin, finish: fin, kodec: ko || dec,
                subdec: sub || dec, koonly: ko, subonly: sub, deconly: dec, finishonly: fin,
                cards: dec, ud: ud, sdmd: sdmd,
                rd1only: rn === 1 && fin, rd12: fin && rn > 0 && rn <= 2,
                rd34: fin && (rn === 3 || rn === 4) };
    var FIGHT = { dist: dec, nodist: fin, anyko: ko, anysub: sub, anydec: dec,
                  anyud: ud, anysdmd: sdmd,
                  first60: fin && rn === 1 && secs >= 0 && secs <= 60,
                  last10: fin && secs >= 290 };
    for (var n = 1; n <= 5; n++) {
      MAN["rd" + n] = fin && rn === n;
      MAN["kord" + n] = ko && rn === n;
      MAN["subrd" + n] = sub && rn === n;
      FIGHT["anykord" + n] = ko && rn === n;
      FIGHT["anysubrd" + n] = sub && rn === n;
    }
    /* the last round, or the cards: whichever way it went past the rest */
    var nr = (FPROPS[card.dataset.bout] || {}).rounds || 3;
    MAN.rdlastdec = dec || (fin && rn === nr);

    card.querySelectorAll(".mkt .price.paid").forEach(function (b) { b.classList.remove("paid"); });
    card.querySelectorAll(".mkt .mktrow[data-mkt]").forEach(function (row) {
      var m = row.dataset.mkt;
      if (m in FIGHT) {
        var b = row.querySelector(".mktcell .price") || row.querySelector(".price");
        if (b && FIGHT[m]) b.classList.add("paid");
      } else if (m in MAN && side >= 0 && MAN[m]) {
        var slot = row.children[side === 0 ? 0 : 2];
        if (slot && slot.classList.contains("price")) slot.classList.add("paid");
      }
    });
    /* the cells in an across-row are nobody's side -- any KO, goes the
       distance -- so the result alone decides them (Jose, Sep 18, 2026) */
    card.querySelectorAll(".mkt .fs5cell[data-mkt]").forEach(function (cell) {
      var m = cell.dataset.mkt, b = cell.querySelector(".price");
      if (b && FIGHT[m]) b.classList.add("paid");
    });
  }
  /* How a bout actually ended, from the one ESPN feed that says so.
     The scoreboard only writes "Unofficial Winner Decision", so every
     decision read DEC and the unanimous price was never marked -- and a
     decision has to be unanimous, split or majority, so one of those three
     paid every time (Jose, Sep 19, 2026: "if he won by dec he had to win by
     one of these"). The bout's own status carries "Decision - Unanimous",
     short "U Dec". It is asked once per bout, after it is settled. */
  /* ---- the fight, played back on the card ----
     Every strike ESPN logged, laid where it landed: red field for the man on
     the left, blue for the right, head at the top and legs at the bottom, a
     dot for the head, a square for the body, a diamond for the legs. A clinch
     slides the seam toward whoever has hold; a takedown turns the whole
     thing a quarter turn; a knockdown drops the downed man's field and only
     his. The clock runs down the middle, round bars across it, and the finish
     is one line from the clock to the mark. Drag to scrub; let go and it
     plays on; it plays once and REPLAY starts it over. The moments come from
     data/fight_plays.jsonl by way of site/anim/<bout>.json, so a card that
     has a file gets the rewind and one that does not gets nothing
     (Jose, Sep 20, 2026, built card by card through the night). */
  function fightAnim(svg, d, againBtn) {
    var NS = "http://www.w3.org/2000/svg";
    var W = 400, FH = 292, CX = 200, CY = 146, TOTAL = d.rounds * 300, SPEED = 30;
    var FL = 46, FR = 354;
    var RED = "#e04e3c", BLUE = "#567ae0";
    var HIT = {a: {1: "#b5392a", 0: "#e09183"}, b: {1: "#2f57b5", 0: "#8fabe8"}};
    var BAND = {head: [12, 84], body: [108, 184], leg: [206, 282]};
    var NEAR = {g: [0.04, 0.20], c: [0.18, 0.44], d: [0.42, 0.96]};
    var CLIP = "clipF" + d.bout;

      clearTimeout(window._sinkWait);
      window._sinkWait = setTimeout(sinkDone, 15000);
      return;
    }
    if (!force && !document.hidden && Date.now() - LASTTOUCH < 12000) {
      clearTimeout(window._sinkWait);
      window._sinkWait = setTimeout(sinkDone, 15000);
      return;
    }
    var slots = [].slice.call(BOARD.querySelectorAll(":scope > .board"));
    /* ---- what "over" means for a row ----
       Two questions, and either one settles it. Was it long enough ago that
       it cannot still be on -- four hours for football, eight for a fight
       card, the same reach the refreshes use. Or does every card drawn in it
       say FINAL.

       It used to be one question, asked of the cards, and the cards are the
       one thing that is not always there to ask: a row is drawn as it is
       scrolled to, a bill folds away undrawn, a bout that never settled sits
       there saying nothing. So a row with no cards could not be judged and a
       row holding one unsettled bout was judged still running -- eight hours
       after the card was over. Either way it stayed at the top of the day
       with the afternoon's results beneath it (Jose, Sep 20, 2026: "it's just
       an order, why are we struggling to keep order"). The clock never waits
       on a fetch, so it is asked first and nothing can hold a finished row up
       any more. */
    var done = function (sl) {
      var k = sl.dataset.kick ? Date.parse(sl.dataset.kick) : 0;
      var far = +sl.dataset.far || 4 * 3600000;
      if (k && Date.now() > k + far) return true;
      var cards = sl.querySelectorAll(".gcard");
      return cards.length > 0 &&
             [].every.call(cards, function (c) { return c.classList.contains("done"); });
    };
    /* A row only ever becomes over; it never goes back. This used to toggle,
       and a row the build had already marked FINAL was un-marked half a
       second later because its cards are drawn as they are scrolled to and
       were not in it yet -- so a finished 11:00 PM row jumped up beside the
       live 11:00 PM row and then went back down (Jose, Sep 20, 2026: "please
       tell me why MONT vs ORST is there"). Nothing that has finished can
       start again, so the mark is put on and left on. */
    slots.forEach(function (sl) { if (done(sl)) sl.classList.add("done"); });
    /* a finished card leaves its row and goes to the foot of the day, with
       the games it kicked off alongside. A row is only a kickoff time, so
       Kansas State and Georgia sat at the top of the board, finished, because
       Clemson in the same row was not (Jose, Sep 19, 2026: "it should be at
       the bottom of the page") */
    /* A card that is over goes to the back of the line on its own, whatever
       else shares its kickoff: that is the rule for the whole board, not for
       whole rows (Jose, Sep 19, 2026: "it's like an order -- when it says
       final it goes to the back of the line").

       It was doing this before and the heading was the problem: the row at
       the foot copied the row at the top word for word, so 3:30 PM appeared
       twice and read as the board saying the same thing over. The seated row
       says FINAL now, the way the finished fight rows already do, so the two
       can never be mistaken for each other. */
    var tail = BOARD.querySelector(":scope > .hidewrap");
    slots.forEach(function (sl) {
      if (sl.dataset.overflow === "1") return;
      var row = sl.querySelector(":scope > .caro");
      if (!row) return;
      var cards = [].slice.call(row.children);
      var over = cards.filter(function (c) { return c.classList.contains("done"); });
      if (!over.length || over.length === cards.length) return;
      var key = "done-" + (sl.dataset.ord || "0");
      var seat = BOARD.querySelector(':scope > .board[data-overflow="1"][data-of="' + key + '"]');
      if (!seat) {
        seat = document.createElement("div");
        seat.className = "board board--nfl done";
        seat.dataset.overflow = "1";
        seat.dataset.of = key;
        seat.dataset.ord = String(1000 + (+sl.dataset.ord || 0));
        seat.dataset.kick = sl.dataset.kick || "";
        seat.dataset.lg = sl.dataset.lg || "";
        seat.dataset.far = sl.dataset.far || "";
        var head = sl.querySelector(":scope > .slot-h");
        if (head) {
          var copy = head.cloneNode(true);
          /* the one thing that must differ from the row it came from */
          var sw = copy.querySelector(".swipe");
          if (sw) sw.parentNode.removeChild(sw);
          if (!copy.querySelector(".slotfin")) {
            var fin = document.createElement("span");
            fin.className = "slotfin";
            fin.textContent = "FINAL";
            copy.appendChild(fin);
          }
          seat.appendChild(copy);
        }
        var into = document.createElement("div");
        into.className = "caro";
        seat.appendChild(into);
        if (tail) BOARD.insertBefore(seat, tail); else BOARD.appendChild(seat);
      }
      var into2 = seat.querySelector(":scope > .caro");
      over.forEach(function (c) { into2.appendChild(c); });
    });
    /* The rows that were just seated are rows too. They were made after this
       list was taken, so they took no part in the ordering -- and since every
       other row is then moved in front of the shelf, the seated one ended up
       above all of them: a FINAL 11:00 PM at the very top with the live
       11:00 PM under it, which is what he was watching happen as he switched
       cards on and off (Jose, Sep 20, 2026). The list is taken again. */
    slots = [].slice.call(BOARD.querySelectorAll(":scope > .board"));
    var over = slots.filter(function (sl) { return sl.classList.contains("done"); });
    if (!over.length || over.length === slots.length) {
      // nothing settled, or everything is: the clock order stands
      over = [];
    }
    /* Both groups run by the clock. Sorting the back of the line by the order
       the rows were built in was right only while nothing moved between the
       groups -- and the whole point is that rows move. A row that finished
       while he watched was built near the front, so when it went to the back
       it went to the front of the back: 10:30 PM sat above 11:30 AM
       (Jose, Sep 20, 2026: "what, doesn't this make sense"). */
    var tick = function (sl) {
      var t = sl.dataset.kick ? Date.parse(sl.dataset.kick) : NaN;
      return isNaN(t) ? (+sl.dataset.ord || 0) : t;
    };
    var order = slots.slice().sort(function (a, b) {
      var ga = over.indexOf(a) >= 0 ? 1 : 0, gb = over.indexOf(b) >= 0 ? 1 : 0;
      if (ga !== gb) return ga - gb;
      var d = tick(a) - tick(b);
      if (d) return d;
      return (+a.dataset.ord || 0) - (+b.dataset.ord || 0);
    });
    var same = order.every(function (sl, i) { return sl === slots[i]; });
    if (same) return;
    /* the hidden-cards drawer sits at the foot, so the slots go in front of it */
    var tail = BOARD.querySelector(":scope > .hidewrap");
    order.forEach(function (sl) {
      if (tail) BOARD.insertBefore(sl, tail); else BOARD.appendChild(sl);
    });
  }

  /* The board was put in order once, when it was built, and again two and a
     half seconds later. Anything that finished after that stayed where it
     was: the cards said FINAL and the row above them did not move. A card
     that settles asks for the order now, and sinkDone stands down by itself
     while he is reading, so nothing moves under his eyes. */
  function askSink() {
    clearTimeout(window._sinkAsk);
    window._sinkAsk = setTimeout(function () { sinkDone(); }, 1200);
  }
  window.askSink = askSink;
  /* ---- when to look again ----
     Only while something on the board is on or about to be. Thirty seconds
     while any game or bout is live (five for a bout, below). Otherwise the
     next look waits for the next kickoff on the board -- twenty minutes
     before it -- and never comes sooner than a minute. Once the last thing
     on the board is over there is nothing left to ask about, and nothing is
     asked: 0 means stop. A college Saturday looks after college, a Sunday
     after the NFL, because the board is what is on the tab (Jose, Sep 20,
     2026: "no more polling for non-live events after they are done -- thin
     for CFB on CFB days and NFL on NFL days"). */
  function nextLook() {
    var now = Date.now(), soonest = Infinity, live = false;
    document.querySelectorAll(".board:not([hidden]) .gcard, .hidebox .gcard").forEach(function (c) {
      if (c.classList.contains("done") || c.dataset.settled === "1" ||
          c.dataset.settledBout === "1") return;
      var k = c.dataset.kick ? Date.parse(c.dataset.kick) : 0;
      if (c.classList.contains("live") || c.querySelector(".glivebar") || (k && k <= now)) { live = true; return; }
      if (k) soonest = Math.min(soonest, k);
    });
    if (live) return 30000;
    if (soonest === Infinity) return 0;
    return Math.max(60000, Math.min(soonest - 20 * 60000 - now, 5 * 60000));
  }
  function refreshVisible() {
    var now = Date.now(), soon = now + 8 * 86400000;
    document.querySelectorAll(".board:not([hidden]) .gcard[data-espn], .hidebox .gcard[data-espn]")
      .forEach(function (card) {
        var k = card.dataset.kick ? Date.parse(card.dataset.kick) : 0;
        if (k && k > soon) return;
        refresh(card);
      });
  }
  refreshVisible();
  refreshFights();
  settleBoxing();
  /* what the other devices left (Jose, Sep 19, 2026) */
  if (typeof pullState === "function") pullState();
  /* One rule, one place. Whatever adds a card -- the first render, a week
     change, a sport change, a card coming back out of the hide shelf -- it
     is colored here, so no two paths can disagree about a club again. */
  function paintAll(root) {
    (root || document).querySelectorAll(".gcard").forEach(function (c) {
      dressClub(c); dressFaces(c); paintSides(c);
    });
  }
  paintAll();
  new MutationObserver(function (recs) {
    var touched = false;
    recs.forEach(function (r) {
      [].forEach.call(r.addedNodes, function (n) {
        if (n.nodeType !== 1) return;
        if (n.classList && n.classList.contains("gcard")) { dressClub(n); dressFaces(n); paintSides(n); touched = true; }
        else if (n.querySelector && n.querySelector(".gcard")) { paintAll(n); touched = true; }
      });
    });
    return touched;
  }).observe(document.body, { childList: true, subtree: true });
  /* the form and money pages keep step with the cards: every thirty seconds,
     the same as the board (Jose, Sep 17, 2026) */
  function formLive() {
    if (sport !== "form" || !LEDGER) return;
    var rows = [];
    Object.keys(LEDGER).forEach(function (w) {
      (LEDGER[w] || []).forEach(function (r) {
        rows.push({ game: r[8], id: r[2], score: r[10], ml: r[6] });
      });
    });
    liveWeek(rows, function () {
      if (sport === "form") { if (formWeek === "season") renderMoney(); else renderForm(); }
    });
  }
  setInterval(formLive, 30000);
  /* the games' beat: as often as nextLook() says, and when it says stop, a
     look at the board every five minutes with no reading behind it, so a tab
     change or a new day picks the beat back up */
  (function gameTicking() {
    var at = 0;
    var beat = function () {
      var want = nextLook();
      clearTimeout(at);
      at = setTimeout(function () {
        if (nextLook()) { refreshVisible(); setTimeout(sinkDone, 1200); setTimeout(placedState, 1400); }
        beat();
      }, want || 5 * 60000);
    };
    beat();
    window.lookAgain = beat;
  })();
  /* While a bout is actually being fought the board asks every five seconds
     instead of every thirty. ESPN's feed is entered cageside, so it runs
     ahead of a stream, which is half a minute or more behind; on a thirty
     second tick the board threw that lead away (Jose, Sep 19, 2026: "can we
     get the speed on the site?"). Nothing else changes: between fights, and
     on a tab he is not looking at, it goes back to thirty. */
  (function fightTicking() {
    var at = 0;
    var anyLive = function () {
      if (document.hidden) return false;
      return !![].slice.call(document.querySelectorAll(".gcard[data-bout]"))
        .filter(function (c) { return c.classList.contains("live"); }).length;
    };
    /* five seconds while a bout is on; otherwise the games' rule: wait for
       the next first bell, and once the last bout is over, nothing -- a look
       at the board every five minutes and no reading behind it */
    var beat = function () {
      var look = nextLook();
      var want = anyLive() ? 5000 : (look || 5 * 60000);
      clearTimeout(at);
      at = setTimeout(function () { if (anyLive() || nextLook()) refreshFights(); beat(); }, want);
    };
    beat();
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { refreshFights(); beat(); }
    });
  })();
  /* the scores looked after themselves but the prices did not: they were read
     once at load, so a board left open all afternoon still showed the morning's
     numbers and only a reload moved them. They are asked for every minute now,
     and again the moment the tab is looked at, which is when a phone comes back
     out of a pocket (Jose, Sep 19, 2026: "so I don't have to refresh my page") */
  /* a placed price goes green the moment the man reaches its rung, rather
     than waiting for the game to settle. The counts are already on the card:
     each touchdown row carries the live number for each man, and the button
     says which rung it is. Johnson ran one in and his price stayed gold
     (Jose, Sep 19, 2026) */
  function placedState(root) {
    (root || document).querySelectorAll(".ptdrow").forEach(function (row) {
      var boxes = row.querySelectorAll(".trkbox");
      if (boxes.length < 2) return;
      var n = [parseInt(boxes[0].textContent, 10), parseInt(boxes[1].textContent, 10)];
      row.querySelectorAll("button.price.placed").forEach(function (b) {
        var m = /ptdbtn--n(\d)/.exec((b.parentElement || {}).className || "");
        if (!m) return;
        var side = b.closest(".ptdside--r") ? 1 : 0;
        if (isNaN(n[side])) return;
        var got = n[side] >= +m[1];
        var over = !!b.closest(".gcard.done");
        b.classList.toggle("won", got);
        b.classList.toggle("lost", over && !got);
      });
    });
  }
  setInterval(placedState, 5000);
  placedState();
  /* the build this page was served as. site/build.txt carries the same stamp,
     so a page left open can tell when a new one has been deployed and take
     it, rather than sitting on old code until somebody reloads by hand */
  var BUILT = "__BUILD__";
  var LASTTOUCH = Date.now();
  /* a swipe along a card row is him using the board as much as a scroll down
     the page is. A scroll on an element does not reach the window, so it is
     caught on the way down instead -- without this the board waited out its
     idle count while he was swiping and then moved the row under him
     (Jose, Sep 19, 2026: "it's still jumping to Clemson") */
  ["scroll", "wheel", "pointerdown", "touchstart", "touchmove", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, function () { LASTTOUCH = Date.now(); },
                              {passive: true, capture: true});
  });
  /* Whether he is in the middle of something the board must not move under.
     An open sheet is the case that bit: a rebuild takes the card's own dialog
     out of the document with it, which closes the sheet he was reading, and
     the version check a moment later then sees no open dialog and reloads.
     He was in another browser tab, so both gates read the page as idle and
     both fired (Jose, Sep 19, 2026: "i was in a modal and it reloaded").
     Being in another tab is not permission to throw his place away. */
  function busy() {
    return !!document.querySelector("dialog[open]");
  }
  var AWAY = 0;        /* when the page went into the background, 0 while seen */
  /* Where he was reading, written on the way out. A phone throws away a tab
     it has not seen for a while and loads the page again by itself when he
     comes back -- nothing here asked for that and nothing here can stop it,
     and it is what actually put him back at the top of the home tab. So the
     place is kept whenever the page is put away, and taken up again by
     whatever loads next, whether that is this page's doing or the browser's
     (Jose, Sep 19, 2026: "i was in a modal and it reloaded"). */
  function keepPlace() {
    try {
      sessionStorage.setItem("arena.at", String(window.scrollY));
      sessionStorage.setItem("arena.sp", String(sport || ""));
    } catch (e) {}
  }
  window.addEventListener("pagehide", keepPlace);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) keepPlace();
  });
  window.busy = busy;
  function watchBuild() {
    fetch("build.txt", {cache: "no-store"})
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (v) {
        if (!v) return;
        v = v.trim();
        /* deployable() stamps the page by replacing every __BUILD__ in it,
           and this line used to compare against one of them -- so once built
           the test read BUILT === BUILT and the version check returned every
           single time. It never fired on any deployed build. A stamp is
           fourteen digits and the placeholder is not, so the shape decides
           it and nothing here can be rewritten out from under it. */
        if (!/^\d{14}$/.test(BUILT) || v === BUILT) return;
        /* A new version is never taken while he is reading. It waits for the
           page to be put away, or for five quiet minutes, because a reload in
           the middle of a scroll throws him back up the board -- ten deploys
           in an hour meant ten jumps (Jose, Sep 19, 2026: "the page is
           jumping, soooo annoying") */
        if (busy()) return;
        /* A page he is looking at never refreshes itself. No scores site or
           book does that, and it is not needed here: prices, marks, scores,
           clocks and finished games are all written onto the board where it
           stands. The only thing a reload buys is new code, which is a thing
           I ship, not a thing the board learns -- so it waits until the page
           is not the one in front of him (Jose, Sep 19, 2026: "a rebuild
           refreshes the page, that doesn't happen on stats sites").

           Five minutes in the background, and then it comes back on the tab
           and at the place he left, so returning to it looks like nothing
           happened. */
        if (!document.hidden) { AWAY = 0; return; }
        if (!AWAY) { AWAY = Date.now(); return; }
        if (Date.now() - AWAY < 5 * 60000) return;
        /* where he was, so the new version opens on it rather than at home */
        try {
          sessionStorage.setItem("arena.at", String(window.scrollY));
          sessionStorage.setItem("arena.sp", String(sport || ""));
        } catch (e) {}
        location.reload();
      })
      .catch(function () {});
  }
  setInterval(watchBuild, 60000);
  /* back to where he was reading, after a version change took the page */
  (function () {
    var at = 0, sp = "";
    try {
      at = parseInt(sessionStorage.getItem("arena.at") || "0", 10) || 0;
      sp = sessionStorage.getItem("arena.sp") || "";
    } catch (e) {}
    try {
      sessionStorage.removeItem("arena.at");
      sessionStorage.removeItem("arena.sp");
    } catch (e) {}
    /* the pill is pressed rather than the variable set, so the reload goes
       through the same switch a tap does and nothing is kept in two places */
    if (sp && sp !== sport) {
      var pill = document.querySelector('#sportbar .sptab[data-sp="' + sp + '"]');
      if (pill) pill.click();
    }
    if (!at) return;
    /* the tab he was on is pressed first and that draws its own board, so the
       place is put back after that render rather than before it -- three
       tries inside a second and a half all landed while the old board was
       still up, and he came back to the top (Sep 19, 2026) */
    var put = function () {
      if (Math.abs(window.scrollY - at) < 4) return;
      if (document.body.scrollHeight < at) return;   /* not drawn that far yet */
      window.scrollTo(0, at);
    };
    [300, 900, 1800, 3000, 4500, 6000].forEach(function (ms) { setTimeout(put, ms); });
  })();
  document.addEventListener("visibilitychange", function () {
    /* coming back to the tab is the moment to take a new version: he is not
       mid-scroll, and the page he left is the page he expects to see move */
    if (document.visibilityState !== "visible") return;
    /* he is back and looking at it, so this is the last moment to reload it:
       take the fresh numbers, leave the version alone */
    AWAY = 0;
    LASTTOUCH = 0;
    pullState();
    pullPrices();
    setTimeout(function () { LASTTOUCH = Date.now(); }, 1500);
  });
  setInterval(pullPrices, 60000);
  setInterval(pullLedger, 60000);
  /* the marks were only read when the page loaded, so a bet marked from
     another device never arrived until he reloaded. They are asked for on the
     same beat as the prices, and the gold lands without a rebuild
     (Jose, Sep 19, 2026: "I don't see it, so I have to refresh?") */
  setInterval(function () { pullState(); }, 60000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    pullPrices();
    pullLedger();
    refreshVisible();
    refreshFights();
  });
  document.getElementById("weekbar").addEventListener("click", function () { setTimeout(refreshVisible, 50); });
</script>
