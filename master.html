<title>The Arena</title>
<meta name="referrer" content="no-referrer">
<!-- the two typefaces are kept in site/font: a reader should not have to
     ask Google for a font to read a scoreboard (Jose, Sep 18, 2026) -->
<link rel="stylesheet" href="font/barlow.css">
<style>
  :root {
    --ground: #0a0a0a;
    --panel: rgba(255, 255, 255, 0.055);      /* the blue */
    --edge: rgba(255, 255, 255, 0.11);
    --ink: #ffffff;
    --muted: #8e8e93;
    --amber: #ffffff;      /* helmet gold */
    --amber-dim: #6e6e73;
    --goldgrad: linear-gradient(180deg, #ffffff 0%, #e6e6e8 55%, #b9b9bd 100%);
    --chip-ink: #1c1c1e;
    --green: #17c257;      /* the green */
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: clip;   /* clip, not hidden: hidden made the body a scroll box and the sticky rail stopped sticking */
               overscroll-behavior-y: none; }        /* no rubber band above the rail (Jose, Sep 16, 2026) */
  html { background: #0a0a0a; }
  body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(60% 40% at 20% 8%, #141414, transparent 70%),
        radial-gradient(60% 45% at 85% 30%, #161616, transparent 70%),
        radial-gradient(70% 50% at 50% 100%, #151515, transparent 70%),
        #0a0a0a;
    }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: Barlow, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    margin: 0;
    /* the foot has to clear the tab bar, which is fixed over it. At 64px it
       cleared it by nothing, so on an iPad the hidden shelf sat under the bar
       and the page would not scroll any further -- the phone rule below
       already allowed for this and the wider screens did not
       (Jose, Sep 19, 2026: "that's as far as I can go down") */
    padding-block: 40px calc(150px + env(safe-area-inset-bottom));
    padding-inline: 20px;
  }
  .sheet { max-width: 520px; margin: 0 auto; }

  header { flex-wrap: wrap; }
  .clock {
    flex-basis: 100%; text-align: center; margin-top: 2px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 12px; letter-spacing: 0.12em;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    margin: 0 -20px 24px; padding: 10px 20px 12px;
    background: rgba(0, 0, 0, 0.82);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  /* the days, along the top */
  .daybar {
    grid-column: 1 / -1; display: flex; gap: 0; overflow-x: auto;
    scrollbar-width: none; padding: 0 14px 2px; margin: 0 -14px;
  }
  .daybar::-webkit-scrollbar { display: none; }
  .daybar[hidden], .weekbar[hidden] { display: none !important; }
  .dtab {
    flex: none; appearance: none; background: none; border: 0; cursor: pointer;
    padding: 7px 13px 9px; border-bottom: 3px solid transparent;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap; line-height: 1.15; text-align: center;
  }
  .dtab b { display: block; font-size: 14px; font-weight: 700; }
  .dtab i { display: block; font-size: 11px; font-style: normal; opacity: 0.75; }
  .dtab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); }
  .dtab:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  /* the sports, along the bottom, where a thumb is */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; align-items: stretch;
    padding: 6px 4px calc(4px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.055);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    border-top: 1px solid rgba(255, 255, 255, 0.14);
  }
  .sptab {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px;
    appearance: none; background: none; border: 0; cursor: pointer;
    padding: 2px 2px; color: var(--muted);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 11.5px; letter-spacing: 0.12em;
    text-transform: uppercase; white-space: nowrap;
  }
  .sptab img { width: 39px; height: 39px; display: block; color: var(--ink); }
  .sptab .daycal { width: 39px; height: 39px; display: block; color: var(--ink); }
  .sptab .spmask {
    width: 39px; height: 39px; display: block;
    background: #f0a02a;
    -webkit-mask-image: var(--m); mask-image: var(--m);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-position: center; mask-position: center;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }

  .sptab .allmk {
    width: 39px; height: 39px; display: grid; place-items: center;
    font-size: 21px; line-height: 1;
  }
  .sptab[aria-selected="true"] { color: var(--amber); }
  .sptab > img, .sptab > .spmask, .sptab > .allmk {
    padding: 4px; border-radius: 13px; box-sizing: content-box;
    border: 1.5px solid transparent;
  }
  .sptab[aria-selected="true"] > img,
  .sptab[aria-selected="true"] > .spmask,
  .sptab[aria-selected="true"] > .allmk {
    border-color: var(--amber); background-color: rgba(255, 255, 255, 0.07);
  }
  .sptab:focus-visible { outline: 2px solid var(--amber); outline-offset: -3px; }
  .lgmk {
    margin: 16px 0 -4px; display: flex; align-items: center; gap: 7px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .lgmk img { width: 14px; height: 14px; }
  .slotday { color: var(--ink); margin-right: 7px; }
  .mmacard .ghead { justify-content: space-between; }
  /* a fight head carries two faces and two long surnames, so it is set
     tighter than a football head and the name is trimmed, not spilled */
  /* a fighter is his face with his name under it, so a long surname has a
     column of its own rather than a share of one row */
  .fman {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 0; flex: 1 1 auto;
  }
  .fhow { color: var(--green); font-weight: 700; letter-spacing: 0.04em; }
  /* the rewind beside FINAL on a bout we hold the moments for: press it and
     the fight plays back on the card, under FINAL and above the rail; press
     it again and it folds away (Jose, Sep 20, 2026) */
  .frewind { appearance: none; background: none; border: 0; padding: 4px 6px; margin-left: 4px;
             cursor: pointer; color: var(--green); line-height: 0; vertical-align: middle;
             border-radius: 6px; }
  .frewind svg { width: 16px; height: 16px; display: block; }
  .frewind[aria-pressed="true"] { background: rgba(57,255,136,0.14); }
  .fanim { margin: 8px 0 2px; }
  .fanim svg { display: block; width: 100%; height: 330px; touch-action: none; cursor: ns-resize; }
  .fanim .again { display: block; margin: 2px auto 2px; background: none; color: #6f6f6f;
                  border: 0; padding: 4px 10px; cursor: pointer;
                  font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700;
                  font-size: 10px; letter-spacing: 0.2em; }
  .fanim .again:hover { color: #fff; }
  .glive { display: block; width: 34px; height: auto; margin: 5px auto 0; }
  .fwt {
    display: block; margin-top: 22px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap;
  }
  .fname {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 15px; letter-spacing: 0;
    line-height: 1.1; color: var(--ink); text-align: center;
    max-width: 100%;
    /* a long surname drops a size rather than losing its letters */
    font-size: clamp(11px, 3.9vw, 15px);
  }
  /* under a face the name has half the card, so it breaks at a space and
     never inside a word -- FERNAN/DES read worse than the spill did
     (Jose, Sep 19, 2026) */
  .fman .fname { white-space: normal; overflow-wrap: normal; }
  /* the name may be wider than the face; the column gives it the room */
  .gcard[data-sport="mma"] .gteam { gap: 0 4px; }
  .gcard[data-sport="mma"] .gml { margin: 0; flex: none; }
  .ffab {
    width: 56px; height: 56px; border-radius: 14px; object-fit: cover;
    object-position: top center; background: #1c1c1e;
    border: 2px solid var(--edge); display: block; flex: none;
  }
  .ffab--none { border-style: dashed; opacity: 0.55; }
  /* the face where a surname would be: name height, not card height */
  .mkface { width: 20px; height: 20px; border-radius: 6px; border-width: 1px;
    display: inline-block; vertical-align: -5px; margin: 0 1px; }
  /* the head carries no prices now, so the man gets the width (Jose, Sep 17, 2026) */
  /* everything on the one line: price, man, how it ended, man, price
     (Jose, Sep 19, 2026: "all in line"). The name is what has to give, so it
     is set to fit the room between a price and the middle rather than spill
     out of the card or break inside a word. */
  .ghead--fight { gap: 4px; }
  /* a bout reads like a passer card: price, name, the two faces together
     with the VS between them, name, price -- and under that line the weight,
     the eye, the clock and the play mark. The W and the L go to the outside
     bottom corners (Jose, Sep 19, 2026).
     .gteam:has(.ffab) sets inline-flex further down and weighs the same, so
     the box only disappears with both of the head's classes on the front. */
  .ghead.ghead--fight { display: flex; flex-wrap: wrap; align-items: center;
    justify-content: center; position: relative; column-gap: 5px; row-gap: 7px; }
  .ghead.ghead--fight > .gteam { display: contents; }
  .ghead.ghead--fight::after { content: ""; flex: 0 0 100%; height: 0; order: 8; }
  .ghead--fight .fman { display: contents; }
  .ghead--fight .gteam--flip > .gml { order: 1; margin: 0; }
  .ghead--fight .gteam--flip .fname { order: 2; }
  .ghead--fight .gteam--flip .ffab { order: 3; }
  .ghead--fight .fvs { order: 4; }
  .ghead--fight .gteam:not(.gteam--flip) .ffab { order: 5; }
  .ghead--fight .gteam:not(.gteam--flip) .fname { order: 6; }
  .ghead--fight .gteam:not(.gteam--flip) > .gml { order: 7; margin: 0; }
  /* the eye, the clock and the play mark hold one line; the class stands
     on its own above the three of them (Jose, Sep 19, 2026) */
  .ghead--fight > .gwhen, .ghead--fight > .gtime { order: 10; }
  /* the class stands behind the whole card, in initials and pounds, sized so
     the longest of them fits inside it (Jose, Sep 19, 2026) */
  .gcard[data-bout] { position: relative; overflow: hidden; container-type: inline-size; }
  .gcard[data-bout][data-wt]::before { content: attr(data-wt); position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700;
    font-size: 20cqw; letter-spacing: 0.06em; white-space: nowrap;
    color: rgba(255, 255, 255, 0.07); pointer-events: none; z-index: 0; }
  .gcard[data-bout] > * { position: relative; z-index: 1; }
  /* the faces sit against each other with the mark on the seam */
  .ghead--fight .ffab { width: 42px; height: 42px; border-radius: 12px; }
  .ghead--fight .gteam--flip .ffab { margin-right: -4px; }
  .ghead--fight .gteam:not(.gteam--flip) .ffab { margin-left: -4px; }
  .ghead--fight .fvs { line-height: 0; color: var(--ink); background: var(--ground);
    border-radius: 5px; padding: 1px; margin: 0 -7px; z-index: 2; flex: none; }
  .ghead--fight .fvs svg { width: 15px; height: 13px; display: block; }
  /* each name takes what is left between its price and the faces */
  /* the name has only what is left between its price and the faces, and a
     long one was running over the price. It is set to fit that room, and
     clipped rather than allowed to leak if a longer one ever turns up
     (Jose, Sep 19, 2026) */
  .ghead--fight .fname { flex: 1 1 0; min-width: 0; text-align: center;
    font-size: clamp(10px, 3.1vw, 15px); letter-spacing: 0;
    overflow: hidden; text-overflow: ellipsis;
    /* the name and what he has done stand together, the height of his own
       picture (Jose, Sep 19, 2026) */
    display: flex; flex-direction: column; justify-content: center;
    min-height: 42px; }
  .ghead--fight .frec { font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--muted); font-style: normal; font-variant-numeric: tabular-nums;
    margin-top: 2px; }
  /* the face says the result before the tile does: grey until the bout is
     settled, then green round the winner and red round the loser. A draw or
     a no contest stays grey (Jose, Sep 19, 2026) */
  .ghead--fight .gteam:has(> .mk.ok) .ffab { border-color: var(--green); }
  .ghead--fight .gteam:has(> .mk.no) .ffab { border-color: #e2564d; }
  /* the W and the L ride each face's own outward bottom corner -- the left
     man's at the left of his picture, the right man's at the right of his --
     half on it and half off (Jose, Sep 19, 2026) */
  .ghead--fight .gteam > .mk { position: relative; z-index: 2; flex: none;
    align-self: flex-end; transform: translateY(7px); pointer-events: none; }
  .ghead--fight .gteam--flip > .mk { order: 2; margin: 0 -17px 0 0; }
  .ghead--fight .gteam:not(.gteam--flip) > .mk { order: 5; margin: 0 0 0 -17px; }
  /* the rim in the card's own colour holds the tile off the photograph and
     off the face's green or red edge. Two pixels, not three: against a 42px
     face a thicker one reads as a slab (Jose, Sep 19, 2026) */
  .ghead--fight .gteam > .mk .wl { border: 2px solid var(--ground);
    width: 18px; height: 18px; border-radius: 5px; font-size: 12px; }
  .ghead--fight .gtime { position: relative; }
  /* moneyline, then the three ways it ends: a price a man, the market between */
  .fways { margin-top: 7px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .mktrow.fway--one {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    border-top: 0; padding: 2px 0 1px; min-width: 0;
  }
  .mktrow.fway--one .price, .mktrow.fway--one .ghost { width: 100%; margin: 0; min-width: 0; }
  .mktrow.fway--one .mktlab {
    flex-direction: row; gap: 5px; font-size: 10.5px; letter-spacing: 0.05em;
    white-space: nowrap; color: var(--muted);
  }
  .mktrow.fway--one .mktmk { display: inline-flex; align-items: center; }
  .mktrow.fway--one .mktmk svg { width: 15px; height: 15px; }
  .mktrow.fway--one .mktmk svg + svg { margin-left: -3px; }
  /* ---- how a fight ends ----
     Seven markets, each man his own column. No prices yet, so every slot is
     the same empty box the football cards use. */
  .mkt { margin-top: 2px; }
  /* the market stands in the middle with each man's price on his own side,
     the way the card's own head reads */
  .mktrow {
    display: grid; grid-template-columns: 76px 1fr 76px;
    align-items: center; gap: 10px; padding: 8px 0;
    border-top: 1px dashed var(--edge);
  }
  .mktrow--head {
    border-top: 0; padding-bottom: 9px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); text-align: center;
  }
  .mktrow--head span { text-align: center; }
  .mktlab {
    display: flex; align-items: center; justify-content: center;
    gap: 9px; min-width: 0;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink);
  }
  .mktmk { display: flex; align-items: center; gap: 3px; flex: none; }
  .mktmk svg { width: 21px; height: 21px; display: block; color: var(--muted); }
  .mktrow .ghost, .mktrow .price { width: 100%; margin: 0; }
  .mktrow .price { min-width: 0; }
  /* two rows that are the same bet: the better price is lit, the worse
     is dimmed, and the pair is marked so it can be found again. */
  /* the four whole-fight markets, two across: each is one label and one
     price, so a full row each was mostly empty */
  .mktgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px;
             border-top: 1px dashed var(--edge); }
  .mktgrid .mktrow--wide { grid-template-columns: 1fr; padding: 10px 0 12px; }
  .mktgrid .mktrow--wide:nth-child(-n+2) { border-top: 0; }
  .mktgrid .mktrow--wide > span:empty { display: none; }
  .mktgrid .mktrow--wide .mktcell { grid-column: 1; margin-top: 8px; }
  .mktgrid .mktlab { font-size: 13px; letter-spacing: 0.04em;
                     text-align: center; text-wrap: balance; }
  .mktrow--wide { grid-template-columns: 76px 1fr 76px; }
  .mktrow--wide .mktcell { grid-column: 2; margin-top: 6px; }
  .mktrow--wide .mktlab { flex-direction: column; gap: 5px; }
  .mktsame { color: var(--amber); }
  .price--better {
    border-color: var(--green); color: var(--green);
    box-shadow: 0 0 0 1px rgba(23, 194, 87, 0.35);
  }
  .price--worse { opacity: 0.45; }
  /* the bout sheet's own tabs and chips (Jose, Sep 18, 2026) */
  /* the five ways a fight ends sit in the middle of their strip. "safe"
     centres them where they fit and falls back to the left edge where they
     do not, so the first of them can still be reached on a narrow phone
     (Jose, Sep 19, 2026) */
  .mtabs { display: flex; justify-content: safe center; border-bottom: 1px solid var(--edge);
    margin: 2px 0 0; overflow-x: auto; scrollbar-width: none; }
  .mtabs::-webkit-scrollbar { display: none; }
  .mtab { flex: none; appearance: none; background: none; border: 0; cursor: pointer;
    padding: 9px 12px 10px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 12.5px; letter-spacing: 0.12em; color: var(--muted);
    border-bottom: 3px solid transparent; white-space: nowrap; }
  .mtab[aria-selected="true"], .mtab.on { color: var(--ink); border-bottom-color: var(--amber); }
  .chips { display: flex; gap: 7px; padding: 10px 0 2px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; appearance: none; cursor: pointer;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 11px; padding: 6px 11px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 12px; letter-spacing: 0.1em; color: var(--muted); }
  .chip.on { color: var(--chip-ink); background: var(--ink); border-color: var(--ink); }
  .cpane.off, .tpane.off { display: none; }
  /* a row nobody's name is on: the label runs and the one price sits at the
     end, rather than stretching across both columns */
  .fs5 { border-top: 1px dashed var(--edge); padding: 7px 0 5px; }
  .fs5row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .fs5cell { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
  .fs5cell i { font-style: normal; display: flex; align-items: center;
    justify-content: center; gap: 3px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700;
    font-size: 10px; letter-spacing: 0.06em; color: var(--muted); }
  .fs5cell i .mktmk svg { width: 13px; height: 13px; }
  .fs5cell .price, .fs5cell .ghost { width: 100%; margin: 0; padding: 5px 0; font-size: 12px; }
  .fs5lab { display: flex; align-items: center; gap: 6px; margin-top: 6px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700;
    font-size: 12.5px; letter-spacing: 0.08em; color: var(--ink); }
  .fs5lab .mktmk svg { width: 17px; height: 17px; color: var(--muted); }
  /* the one-price rows read left to right: the label on the left, the price
     at the end (Jose, Sep 18, 2026) */
  .mkt .mktrow--one { grid-template-columns: 1fr 84px; }
  .mkt .mktrow--one .mktlab { justify-content: flex-start; text-align: left; }
  .fsnone { font-family: Barlow, sans-serif; font-size: 13px; color: var(--muted); padding: 18px 2px; text-align: center; }
  .mktnote {
    margin: 10px 2px 0; font-size: 11.5px; color: var(--amber);
    line-height: 1.35;
  }
  .mktnote[hidden] { display: none !important; }
  .mmaname {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 15px; letter-spacing: 0.04em;
    color: var(--ink); text-transform: uppercase; line-height: 1.15;
  }
  /* the weeks, along the top, the way the league counts them */
  .weekbar {
    grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    padding: 0 14px 2px; margin: 0 -14px;
  }
  .weekbar::-webkit-scrollbar { display: none; }
  .wktab {
    flex: none; appearance: none; background: none; border: 0;
    padding: 7px 2px 9px; cursor: pointer;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 15px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 3px solid transparent; white-space: nowrap;
  }
  .wktab + .wktab { margin-left: 12px; }
  .weekbar { padding-bottom: 2px; }
  .wktab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); }
  .wktab:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .dayhead {
    margin: 18px 0 2px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 19px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink);
  }
  .dayhead .amber { color: var(--amber); }
  #pool { display: none !important; }
  .lgmk[hidden], .dayhead[hidden] { display: none !important; }
  .wkempty {

  .price {
    /* two taps on a price mark it placed, and a phone's own answer to two
       taps is to zoom. "manipulation" tells it this element has no double

    touch-action: manipulation;

  .caro {

  /* where the ball is, under the score line: a ruler, a fill up to the

  /* the yard label hangs above the bar, so the block needs room at the

  .drive { display: none; padding: 27px 2px 3px; }

  .drvtick i.big { height: 5px; background: rgba(255, 255, 255, 0.42); }
  /* A bout's own timeline, read the way the drive bar on a game card reads:
     one rail, a section per round, filling as the fight runs. Where football
     writes the down and distance, a fight writes how it ended once it has
     (Jose, Sep 19, 2026: "call this timeline... 3 sections sorted equally for
     the round, and it'll be the time counting"). */
  .tline { display: none; padding: 27px 2px 3px; }
  .gcard.has-tline .tline { display: block; }
  .tlwrap { position: relative; }
  .tlat { position: absolute; bottom: 100%; transform: translateX(-50%);
          margin-bottom: 4px; white-space: nowrap;
          font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
          font-weight: 700; font-size: 11.5px; letter-spacing: 0.05em;
          color: #ffffff; font-variant-numeric: tabular-nums; }
  /* on a finished bout the label is the board's own marks -- the glove, the

     icon, then the icon for R5") */
  .tlat { display: inline-flex; align-items: center; gap: 3px; }
  .tlat svg { width: 21px; height: 18px; display: block; flex: none; }
  .tlat svg.mk--ko { width: 20px; height: 20px; }
  .tlbar { position: relative; height: 3px; border-radius: 2px;

  .tlcut { position: absolute; top: -5px; bottom: -5px; width: 3px; z-index: 2;

  /* the ticks under a bout say where the rounds are, not how long the rail

     each round, and the fine ones between them kept faint
     (Jose, Sep 19, 2026: "3 equal ticks then one in each, like the .5") */
  /* the marks stand on the rail itself, crossing it, rather than in a row
     underneath it (Jose, Sep 19, 2026: "it needs to be on the line") */
  .tltick { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .tltick i { position: absolute; top: 50%; width: 2px; border-radius: 1px;

  /* while a bout is on, the mark and the clock stand on one line together

  .qside .lmk svg { width: 100%; height: 100%; }
  .lnum { font-size: 14px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; justify-self: start; }
  .ln--zero { opacity: 0.35; }
  /* his name laid over the card, so nothing else moves for it */
  .qname { position: absolute; z-index: 3; left: 0; right: 0; bottom: 6px; display: flex;
    align-items: center; justify-content: center; gap: 6px; pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.85), 0 0 12px rgba(0,0,0,0.6); }
  .qname h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }
  .qname .hurt, .qname .cold { width: 17px; height: 17px; margin: 0; }
  .qbface[data-ring] { cursor: pointer; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; }
  /* the same gold a placed price wears, so a man marked on the ledger reads as
     marked rather than as one more white edge (Jose, Sep 20, 2026) */
  .qbface--ring { border-color: #e3b341; border-width: 2px;
    box-shadow: 0 0 0 1px rgba(227, 179, 65, 0.35), 0 0 10px rgba(227, 179, 65, 0.40); }
  .ptdhead--bare { grid-template-columns: 1fr auto 1fr; }
  .ptdhead--bare::before, .ptdhead--bare::after { content: ""; }
  .ptdrow { display: flex; align-items: flex-start; gap: 8px; }
  .ptdside { flex: 1; min-width: 0; }
  .ptdzero {
    flex: none; align-self: flex-start; margin-top: -3px;
    font-weight: 700; font-size: 12px; color: var(--muted);
  }
  .ptdbar { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.16); }
  .ptdfill { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--goldgrad); }
  .ptdside--r .ptdfill { background: linear-gradient(180deg, #ffffff 0%, #e6e6e8 55%, #b9b9bd 100%); }
  .ptdbar .tick { position: absolute; top: -4px; bottom: -4px; width: 3px; background: #fff; border-radius: 2px; }
  /* Measured against half the bar (93px) two 70px chips overlap by 24px;
     measured against half the section (156px) they fit with room to spare.
     So the row is pinned to the section rather than sitting inside the bar's
     half, in the band reserved at the foot of it — clear of the count boxes,
     which stop 38px down. The higher number sits outside, nearer the edge of
     the card, and the lower one inside, on both sides of the zero. */
  .ptdmarks {
    position: absolute; bottom: 4px; width: calc(50% - 4px);
    display: flex; gap: 6px; justify-content: center; align-items: flex-start;
  }
  .ptdside--l .ptdmarks { left: 0; }
  .ptdside--r .ptdmarks { right: 0; }
  .ptdbtn { flex: none; }
  .ptdside--l .ptdbtn--n2 { order: 0; }
  .ptdside--l .ptdbtn--n1 { order: 1; }
  .ptdside--r .ptdbtn--n1 { order: 0; }
  .ptdside--r .ptdbtn--n2 { order: 1; }
  .ptdbtn .price { margin: 0; }

  /* ---- the PTD section, second cut (TB/CIN only for now) ---- */
  /* the running count sits up beside the label, one per quarterback */
  /* the count box sits level with the bar it counts for, now that the
     price chips have left the row for the band underneath */
  .ptdx--v2 .ptdrow { align-items: center; }
  /* the zero belongs to the bar, not to the top of a row the count box made
     tall, and the label has no reason to stand off from either */
  .ptdx--v2 .ptdzero { align-self: center; margin-top: 0; }
  .ptdx--v2 { padding-top: 4px; }
  .ptdx--v2 .ptdhead { margin-bottom: 6px; }
  /* Each price hangs under the stretch of bar it buys: 1+ over the ground
     between 0 and 1, 2+ over the ground between 1 and 2. Measured against
     the bar, not against half the section, so it lines up with the numbers
     on it whether or not the other price is offered. */
  .ptdx--v2 .ptdside { position: relative; }
  .ptdx--v2 .ptdmarks {
    position: static; display: block; width: auto; height: 0;
  }
  .ptdx--v2 .ptdbtn { position: absolute; top: 15px; }
  .ptdx--v2 .ptdside--l .ptdbtn { transform: translateX(50%); }
  .ptdx--v2 .ptdside--r .ptdbtn { transform: translateX(-50%); }
  /* 20 and 80 rather than the middle of each span: still inside 0-to-1 and
     1-to-2, but far enough apart that two 48px chips clear each other on the
     narrowest bar the board has, which is 93px. */
  .ptdx--v2 .ptdside--l .ptdbtn--n1 { right: 20%; }
  .ptdx--v2 .ptdside--l .ptdbtn--n2 { right: 80%; }
  .ptdx--v2 .ptdside--r .ptdbtn--n1 { left: 20%; }
  .ptdx--v2 .ptdside--r .ptdbtn--n2 { left: 80%; }
  /* the chance a price implies, standing over the stretch of bar it is
     about, in the strip that was empty between the label and the bar */
  .ptdx--v2 .ptdpct {
    position: absolute; top: -18px;
    font-size: 11px; font-weight: 700; color: var(--green);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ptdx--v2 .ptdside--l .ptdpct { transform: translateX(50%); }
  .ptdx--v2 .ptdside--r .ptdpct { transform: translateX(-50%); }
  .ptdx--v2 .ptdside--l .ptdpct--n1 { right: 20%; }
  .ptdx--v2 .ptdside--l .ptdpct--n2 { right: 80%; }
  .ptdx--v2 .ptdside--r .ptdpct--n1 { left: 20%; }
  .ptdx--v2 .ptdside--r .ptdpct--n2 { left: 80%; }
  /* ---- the sample: two footballs in place of the bar ----
     Empty is a ball nobody has thrown yet. Green means he threw it. Red means
     the game finished and he did not. */
  /* Four prices, two count boxes and the nought share 338px, so the row is
     a grid: a flex row lets the cells overflow into each other, which is
     exactly what they did. */
  /* the count boxes stand on the outside, like the head-to-head's; the two
     sides meet in the middle, 1+ innermost, 2+ next (Jose, Sep 16, 2026) */
  .ptdx--v2.ptdx--balls .ptdrow {
    display: grid; gap: 2px; align-items: center;
    /* minmax(0,1fr), so the middle gives way before the card does */
    grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto;
  }
  .ptdx--v2.ptdx--balls .ptdrow > .trkbox:nth-of-type(1) { grid-column: 1; grid-row: 1; }
  .ptdx--v2.ptdx--balls .ptdrow > .ptdside--l { grid-column: 2; grid-row: 1; justify-content: end; padding-right: 0; }
  .ptdx--v2.ptdx--balls .ptdrow > .ptdside--r { grid-column: 3; grid-row: 1; justify-content: start; padding-left: 0; }
  .ptdx--v2.ptdx--balls .ptdrow > .trkbox:nth-of-type(2) { grid-column: 4; grid-row: 1; }
  /* the two footballs stack, one above the other, each beside its own price
     -- side by side they had to be shrunk to fit; stacked they do not */
  .ptdx--v2.ptdx--balls .ptdside {
    display: grid; grid-template-columns: 1fr; gap: 3px;
    align-content: center; justify-items: center; min-width: 0;
  }
  /* the sides used to count outward from the bar, which read as 2 over 1 on
     the left and 1 over 2 on the right. Stacked, both read one then two. */
  .ptdx--v2.ptdx--balls .ptdbtn--n1 { order: 0; }
  .ptdx--v2.ptdx--balls .ptdbtn--n2 { order: 1; }
  /* an unpriced cell holds a ghost, not a price -- without an area of its own
     it auto-placed into the first free column and pulled the row out of line */
  .ptdx--v2.ptdx--balls .ghost { grid-area: odds; }
  /* the 1+/2+ label is not drawn in this layout but was still auto-placing,
     which opens an implicit column and shifts whatever follows it */
  .ptdx--v2.ptdx--balls .ptdline { grid-area: ball; }
  .ptdx--v2.ptdx--balls button.price {
    width: 42px; min-width: 42px; max-width: 42px; padding: 0 2px; font-size: 12px;
    grid-area: odds; white-space: nowrap;
    height: 34px; display: flex; align-items: center; justify-content: center;
  }
  /* The price stands beside the ball, on the outer side of it, and the chance
     sits under the ball itself. Each cell is two columns and two rows, so the
     four of them line up whatever they hold. */
  .ptdx--v2.ptdx--balls .ptdbtn {
    position: static; transform: none; inset: auto;
    min-width: 0; max-width: 100%; display: grid; gap: 0 8px;
    align-items: center; justify-items: center;
  }
  /* the price and the chance stack together; the ball stands on its own
     beside them, spanning both rows */
  /* one line: the chance, then the price, then the ball -- mirrored on the
     other side so the balls face each other across the counts */
  /* the highlight sits outside the chance, on the same line -- the extra
     column only exists on cells that have one, so nothing shifts on the rest */
  /* the column belongs to the SIDE, not the row -- one touchdown and not two
     left the play column on one row only, so the two chances did not line up */
  /* The SIDE is the grid and each row's cell is display: contents, so the
     two rows share their columns: a priced row and an unpriced one, a row
     with a chance and one without, all put the ball on the same line. Each
     row's own grid used to size its own columns, and the balls wandered. */
  .ptdplay { grid-area: play; }
  .ptdx--v2.ptdx--balls .ptdside {
    display: grid; row-gap: 10px; column-gap: 5px; min-width: max-content;
    align-items: center; justify-items: center; justify-content: center;
  }
  /* one line a side: odds, ball, odds, ball -- the counts -- ball, odds, ball,
     odds. The 1+ pair sits nearer the edge, the 2+ pair nearer the counts.
     (Jose, Sep 16, 2026) */
  /* fixed columns, so the passing row and the anytime row line up whatever
     their prices say (Jose, Sep 16, 2026) */
  .ptdx--v2.ptdx--balls .ptdside--l {
    grid-template-columns: [odds2-start] 38px [odds2-end ball2-start] 28px [ball2-end odds-start] 38px [odds-end ball-start] 28px [ball-end];
  }
  .ptdx--v2.ptdx--balls .ptdside--r {
    grid-template-columns: [ball-start] 28px [ball-end odds-start] 38px [odds-end ball2-start] 28px [ball2-end odds2-start] 38px [odds2-end];
  }
  /* no play mark in the row: the ball itself is the clip when there is one.
     The ball stands upright, and a clip puts a play triangle over the laces
     (Jose, Sep 16, 2026). */
  .ptdx--v2.ptdx--balls .ptdplay { display: none; }
  /* the rushing row carries one rung, so the outer pair of columns is free:
     the clip gets its own play mark there, beside the price (Jose, Sep 17, 2026) */
  .ptdx--v2.ptdx--balls.ptdx--run .ptdplay { display: inline-flex; grid-area: ball2; }
  .ptdx--v2.ptdx--balls.ptdx--run .ptdplay { width: 26px; height: 26px; }
  .ptdx--v2.ptdx--balls.ptdx--run .ptdplay svg { width: 24px; height: 24px; }
  .ptdx--v2.ptdx--balls .ntick.ball svg.rushmk { transform: none; }
  .ptdx--v2.ptdx--balls .ntick.ball.ball--run { padding: 0; color: var(--fb-skin); }
  .ptdx--v2.ptdx--balls .ntick.ball.ball--run.ball--clip::before { display: none; }
  .ptdx--v2.ptdx--balls .ntick.ball.ball--clip { cursor: pointer; position: relative; }
  /* a disc in the ball's own colour hides the laces; the triangle sits on it */
  .ptdx--v2.ptdx--balls .ntick.ball.ball--clip::before {
    display: none;
  }
  .ptdx--v2.ptdx--balls .ntick.ball.ball--clip::after { content: none; }
  .ptdx--v2.ptdx--balls .ntick.ball.ball--clip.hit::after {
    content: ""; position: absolute; left: 50%; top: 17%;
    width: 8.5px; height: 10px; margin: -5px 0 0 -4.25px; top: 19%;
    background: #fff; clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  /* the left side's marks are mirrored, so the triangle is turned back or it
     would point the wrong way */
  .ptdside--l .ntick.ball.ball--clip.hit::after { transform: scaleX(-1); }
  /* the anytime row carries only 1+: box, price, runner -- runner, price, box
     (Jose, Sep 16, 2026) */
  .gcard .ptdx--v2.ptdx--balls[data-kind="ATD"] .ptdside .ptdbtn--n2 > * { display: none; }
  .ptdx--v2.ptdx--balls[data-kind="ATD"] .ptdside--l { grid-template-columns: [play-start] 28px [play-end odds-start] 42px [odds-end ball-start] 30px [ball-end]; }
  .ptdx--v2.ptdx--balls[data-kind="ATD"] .ptdside--r { grid-template-columns: [ball-start] 30px [ball-end odds-start] 42px [odds-end play-start] 28px [play-end]; }
  .gcard .ptdx--v2.ptdx--balls.ptdx--run .ptdside .ptdplay { grid-column: play; grid-row: 1; }
  .ptdx--v2.ptdx--balls[data-kind="ATD"] .ntick.ball.ball--run { width: 30px; height: 30px; }
  .ptdx--v2.ptdx--balls[data-kind="ATD"] button.price { width: 42px; min-width: 42px; max-width: 42px; }
  .ptdx--v2.ptdx--balls .ptdbtn { display: contents; }
  /* grid-area on the children is a shorthand that also sets the row, so the
     row must be said with more weight than any of those */
  .gcard .ptdx--v2.ptdx--balls .ptdside .ptdbtn--n1 > *,
  .gcard .ptdx--v2.ptdx--balls .ptdside .ptdbtn--n2 > * { grid-row: 1; }
  /* the column only -- grid-area would set the row too, and there is no
     row line by that name, so the ball fell to a line of its own */
  .ptdx--v2.ptdx--balls .ptdbtn--n2 > .ghost, .ptdx--v2.ptdx--balls .ptdbtn--n2 > button.price { grid-column: odds2; }
  .ptdx--v2.ptdx--balls .ptdbtn--n2 > .ntick.ball, .ptdx--v2.ptdx--balls .ptdbtn--n2 > .ptdline { grid-column: ball2; }
  .ptdx--v2.ptdx--balls .ptdbtn--n2 > .ptdplay { grid-column: ball2; }
  .ptdx--v2.ptdx--balls .ghost, .ptdx--v2.ptdx--balls button.price {
    justify-self: stretch; min-width: 0; max-width: 100%; box-sizing: border-box;
    padding-left: 2px; padding-right: 2px; }
  .ptdx--v2.ptdx--balls .ntick.ball { grid-area: ball; }
  .ptdx--v2.ptdx--balls .ballpct { grid-area: pct; }
  /* the count is the thing being counted, so it is the biggest mark in the
     row, and the price chips are cut to its height */
  /* every count box on a card is one size -- head to head, passing, rushing.
     The marks and prices in the middle were pulled together to pay for it
     (Jose, Sep 18, 2026). This selector has to be at least as specific as the
     rule it replaces, or the touchdown rows quietly keep the old size. */
  .gcard .trkbox,
  .gcard .h2hrow .trkbox,
  .gcard .ptdx--v2.ptdx--balls .trkbox {
    min-width: 46px; height: 50px; font-size: 22px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center;
  }
  /* a narrow phone has no room for the big box: the box comes down a size and
     the prices and marks beside it give way too, so the row fits inside the
     card instead of running under it (Jose, Sep 18, 2026) */
  @media (max-width: 560px) {
    .gcard .trkbox,
    .gcard .h2hrow .trkbox,
    .gcard .ptdx--v2.ptdx--balls .trkbox {
      min-width: 34px; height: 44px; font-size: 18px;
    }
    .gcard .ptdx--v2.ptdx--balls .price {
      min-width: 0; padding: 4px 5px; font-size: 12px; margin: 2px 0;
    }
    .gcard .ptdx--v2.ptdx--balls .ntick.ball { transform: scale(0.85); }
    .gcard .ptdx--v2.ptdx--balls .ptdside { gap: 2px; min-width: 0; }
    .gcard .ptdx--v2.ptdx--balls .ptdrow { gap: 2px; }

  }
  /* the nought marked where the bar began; there is no bar to begin */
  .ptdx--v2.ptdx--balls .ptdzero { display: none; }
  /* the second cut hangs its chips off the bar absolutely; there is no bar
     here, so they come back into the flow and stack under their own ball */
  .ptdx--v2.ptdx--balls .ptdside { position: static; }
  .ptdx--v2.ptdx--balls .ptdline { display: none; }
  /* the element is a tick and a ball at once, and the tick rules are the
     more specific, so the ball has to out-rank them rather than out-order */
  .ptdx--v2.ptdx--balls .ntick.ball {
    display: block; position: static; inset: auto;
    /* one box for every mark, so the passing and the anytime rows share their
       columns; the football is drawn 20px inside it, the runner fills it */
    width: 28px; height: 28px; padding: 0; box-sizing: border-box; background: none; text-shadow: none;
  }
  .ptdx--balls .ball svg { width: 100%; height: 100%; display: block; }
  /* bet365's own mark, recoloured. The ball is drawn through <use>, so its
     paths live in a shadow tree that a class selector cannot reach -- custom
     properties do cross, and the symbol paints from those. */
  .ball {
    --fb-skin: var(--muted); --fb-edge: var(--muted); --fb-seam: var(--muted);
    opacity: 0.5;
  }
  .ball.hit {
    --fb-skin: #17c257; --fb-edge: #0c1a12; --fb-seam: #0c1a12; opacity: 1;
  }
  .ball.miss {
    --fb-skin: #e2564d; --fb-edge: #2a0f0d; --fb-seam: #2a0f0d; opacity: 1;
  }
  /* the left side's marks are flipped, so the two sides mirror each other
     across the counts rather than both pointing the same way */
  .ptdside--l .ball { transform: scaleX(-1); }
  /* The boost mark is a flat orange picture with nothing to recolour, so its
     alpha is used as a mask and the colour comes from here -- the same green
     and red the footballs answer to. */
  .boltmk {
    display: block; width: 100%; height: 100%;
    background: var(--fb-skin);
    /* longhand: the shorthand dropped the sizing, which left a 760px picture
       showing through a 26px window -- that is, nothing */
    -webkit-mask-image: url("ico/atd-mask.png");
    mask-image: url("ico/atd-mask.png");
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-position: center; mask-position: center;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    /* the picture's empty margin is cropped, so "contain" now fills the box;
       a touch of scale past it matches the football's visual weight */
    transform: scale(1.32);
  }
  /* the highlight, beside the percentage on the outer edge */
  /* the sheet itself has no side padding, so the player and the list carry
     their own gutter or the headline runs off the edge */
  #vidsheet .vidplay, #vidsheet .vidnow, #vidsheet .vidlist { margin-inline: 14px; }
  .vidplay { width: calc(100% - 28px); aspect-ratio: 16 / 9; display: block;
             background: #000; border-radius: 12px; }
  .vidnow { margin: 10px 0 2px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
            font-weight: 700; font-size: 15px; letter-spacing: 0.04em;
            text-transform: uppercase; color: var(--ink); }
  /* display:flex here outranks the browser's own [hidden] rule, so setting
     the property alone left the list on screen -- it has to be said again */
  #vidlist[hidden] { display: none !important; }
  .vidlist { display: flex; flex-direction: column; gap: 2px;
             padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .vidone { display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 10px 2px; background: none; border: 0; cursor: pointer;
            border-top: 1px dashed var(--edge); color: var(--muted);
            font-family: Barlow, "Helvetica Neue", Arial, sans-serif;
            font-size: 13px; text-align: left; }
  .vidone[aria-current="true"] { color: var(--ink); }
  .vidone svg { width: 17px; height: 17px; flex: none; }
  .vidone .vidsec { margin-left: auto; font-variant-numeric: tabular-nums;
                    font-size: 12px; color: var(--muted); }
  .ptdplay { display: inline-flex; align-items: center; justify-content: center;
             width: 19px; height: 19px; padding: 0; margin: 0 0 0 4px;
             border: 0; background: none; color: var(--muted); cursor: pointer;
             vertical-align: middle; }
  .ptdplay:hover, .ptdplay:focus-visible { color: var(--ink); }
  .ptdplay svg { width: 19px; height: 19px; display: block; }
  .ballpct {
    font-family: Barlow, sans-serif; font-weight: 600; font-size: 11.0px;
    color: var(--green); font-variant-numeric: tabular-nums; line-height: 1;
  }
  .ptdx--v2.ptdx--balls .ptdcount { align-self: center; }
  /* no rule above the footballs: the section stands on its own */
  .ptdx--v2.ptdx--v2.ptdx--balls {
    padding-top: 2px; padding-bottom: 6px; border-top: 0;
  }
  /* a fight is won or lost and that is the whole market, so its moneyline
     wants no chance printed beside it. And a fighter has a name rather than a
     three-letter club, so it is set smaller and held on the price's line —
     left to wrap it dropped underneath and broke the row. */
  .gcard:not([data-lg]) .ghead .pct { display: none; }
  .gcard:not([data-lg]) .ghead .gteam {
    flex-wrap: nowrap; white-space: nowrap; font-size: 15px; min-width: 0;
  }
  .gcard:not([data-lg]) .ghead .price { min-width: 46px; padding: 6px 7px; }
  /* a chip here is a price, nothing else — and it is 56px only because
     min-width says so, which is 4px more than the gap between the marks
     it has to sit between */
  .ptdx--v2 .ptdbtn .pct { display: none; }
  .ptdx--v2 .ptdbtn .price { min-width: 48px; padding: 6px 7px; }
  /* The numbers are the ticks, standing at their own place on the bar's
     scale, so the fill reaching one is the same event as it turning green.
     The chip keeps its 1+ / 2+ out of sight, because the slip reads it. */
  /* the chip's own 1+ / 2+ would repeat the number on the bar, so it stays
     in the markup for the slip to read and off the card */
  .ptdx--v2 .ptdline { display: none; }
  .ptdx--v2 { padding-bottom: 28px; }
  .ptdx--v2 .ptdmarks { bottom: 2px; }
  /* the number stands where the tick stood, punched out of the track so it
     reads over the fill and over the empty part alike */
  .ntick {
    position: absolute; top: 50%; width: 0;
    color: rgba(255, 255, 255, 0.9);
  }
  .ntick b {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    font-size: 16px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; color: currentColor;
    /* No box and no border — just the number, big enough to carry its own
       color. The dark halo is only so green holds up where it crosses the
       gold, which is the one place the two are close in tone. */
    text-shadow: 0 0 4px #000, 0 0 3px #000, 0 1px 2px #000;
  }
  .ntick.hit { color: var(--green); }
  .ntick.miss { color: #e2564d; }
  .ptdline {
    display: block; text-align: center; margin-bottom: 3px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 11px; letter-spacing: 0.08em; color: var(--muted);
  }
  .ptdcount { flex: none; align-self: flex-start; }
  .h2hx { padding: 10px 0 20px; border-top: 1px dashed var(--edge); }
  /* each passer's name under his own end of the bar */
  .h2hstack { flex: 1; min-width: 0; }
  /* Each name takes half the track and centres in it, so it stands over the

  .slipbar {
    position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 14px;
    padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.055);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    border-top: 1px solid rgba(255, 255, 255, 0.14);

  .slipbar[hidden] { display: none !important; }
  /* riding with an open sheet it sits directly under it, not over it */
  /* inside an open sheet the bar is that sheet's last row: the sheet sits
     above it, nothing overlaps, and it can be pressed */
  dialog.sheet > .slipbar { position: static; flex: none; }
  .slipbar { transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1); }
  .slipbar--pulling { transition: none; }
  .sliptab { touch-action: pan-x; }
  .slipbar .n { color: var(--muted); font-size: 13px; }
  .slipbar a {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--chip-ink); background: var(--amber);
    border-radius: 8px; padding: 8px 18px; text-decoration: none;
  }
  /* Below about 380px half a section is 141px and the pair needs 146, so on
     the smallest phones they go back to one above the other rather than
     overlapping. Everywhere else they sit side by side. */
  /* The fallback was for chips 70px wide sharing a 92px half. A chip in the
     second cut is 48px and hangs off the bar, so it fits at 320 and does not
     want stacking. */
  @media (max-width: 380px) {
    .ptdx:not(.ptdx--v2), .ptdx:not(.ptdx--v2):has(.mk) { padding-bottom: 2px; }
    .ptdx:not(.ptdx--v2) .ptdmarks {
      position: static; width: auto; margin-top: 8px;
      flex-direction: column; gap: 4px; align-items: center;
    }
    /* On the smallest phones the narrowest bar is 58px, which leaves 35px
       between the marks — no price is legible at that width. The chips come
       off the bar and stack under it; the bar still carries its numbers and
       the chances still stand over it. */
    .ptdx--v2 { padding-bottom: 68px; }
    .ptdx--v2 .ptdmarks {
      position: static; height: auto; display: flex; flex-direction: column;
      align-items: center; gap: 4px; margin-top: 10px;
    }
    .ptdx--v2 .ptdbtn { position: static; transform: none; }
    .ptdx--v2 .ptdbtn--n1 { order: 0; }
    .ptdx--v2 .ptdbtn--n2 { order: 1; }
  }
  /* every slot being a full box makes a head wider than it was, so the club
     gives up a little size on a narrow phone rather than dropping a line */
  @media (max-width: 400px) {
    .gteam { font-size: 18px; }
  }
  @media (max-width: 700px) {
    /* the rail sits flush at the top and sticks; the cards scroll under it
       (Jose, Sep 16, 2026) */
    body { padding-block: 0 calc(150px + env(safe-area-inset-bottom));
         padding-inline: 12px; }
    header { margin: 0 -12px 20px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
    .board { padding: 4px 12px; }
    h1 { font-size: 40px; }
  }

  /* A phone has about 38px of padding on each side before the card even
     starts, and the touchdown row wants it. The card may sit on the edge of
     the screen -- it may not hang off it (Jose, Sep 18, 2026). This block has
     to come after the 700px one above, which sets the same properties. */
  @media (max-width: 560px) {
    body { padding-inline: 2px; }
    header { margin: 0 -2px 20px; padding: calc(10px + env(safe-area-inset-top)) 2px 10px; }
    .board { padding: 4px 0; }
    .caro { margin: 0; padding: 0; }
    .gcard { padding-left: 10px; padding-right: 10px; }
  }

  /* ---- Sheets ----
     A sheet comes up from the bottom and goes back down the same way. The
     pull only drags when what is under the finger is already at its top;
     anywhere else the same movement is a scroll, which is what it looks
     like it should be. */
  dialog.sheet {
    display: flex; flex-direction: column;
    width: min(560px, calc(100% - 32px)); max-width: none;
    height: fit-content; max-height: 88vh;
    margin: auto; padding: 0;
    background: rgba(255, 255, 255, 0.06);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    backdrop-filter: blur(22px) saturate(1.5);
    color: var(--ink); font: inherit;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.62);
    overflow: hidden;
    /* the gesture belongs to the sheet, not to the page under it */
    touch-action: none;
    overscroll-behavior: contain;
  }
  /* display:flex beats the rule that hides a shut dialog, so say it again. */
  dialog.sheet:not([open]) { display: none; }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.58); }
  .sheet__head {
    flex: none; display: grid; grid-template-columns: 40px 1fr 40px;
    align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.13);
  }
  .sheet__head > :first-child { justify-self: start; }
  .sheet__head > :last-child { justify-self: end; }
  .sheet__title {
    margin: 0; justify-self: center; text-align: center;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 19px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .sheet__x {
    background: none; border: 0; padding: 6px; line-height: 0;
    color: var(--amber); cursor: pointer; border-radius: 8px;
  }
  .sheet__scroll {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch; padding: 10px 14px 14px;
    /* the middle still scrolls, and stops rather than dragging the page */
    touch-action: pan-y;
    overscroll-behavior: contain;
  }
  .sheet__foot {
    flex: none; padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255, 255, 255, 0.13);
  }
  .sheet__foot #sliplink { margin-top: 0; }
  @media (max-width: 700px) {
    dialog.sheet {
      width: 100%; max-width: 100%; height: fit-content; max-height: 88vh;
      margin: auto 0 0; padding-top: 18px;
      border: 0; border-radius: 20px 20px 0 0;
      box-shadow: 0 -10px 50px rgba(0, 0, 0, 0.62);
      animation: sheet-up 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    /* the handle that says it can be pulled */
    dialog.sheet::before {
      content: ''; position: absolute; top: 7px; left: 50%;
      width: 38px; height: 5px; margin-left: -19px;
      background: rgba(255, 255, 255, 0.3); border-radius: 999px;
    }
    /* while a finger is on it there is no animation to fight */
    dialog.sheet--dragging { animation: none; transition: none; }
    /* and when it is let go it falls back into place or leaves */
    dialog.sheet--settling {
      animation: none; transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
    }
  }
  @keyframes sheet-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  /* the page behind a sheet is held where it was */
  body.sheeted { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden;
    overscroll-behavior: none; }
  @media (prefers-reduced-motion: reduce) {
    dialog.sheet { animation: none; }
    dialog.sheet--settling { transition: none; }
  }
</style>

<script>
  /* carried in from the old address: sports-odds.pages.dev reads its own
     browser's picks and hidden list, sends them here on the hash once, and
     they are folded into this browser's before anything reads them. What is
     already here wins; the hash is dropped so a reload does not do it twice
     (Jose, Sep 18, 2026: "why would I open the old when I don't want to use
     the old") */
  try {
    var carry = /^#carry=(.+)$/.exec(location.hash);
    if (carry) {
      var got = JSON.parse(decodeURIComponent(escape(atob(carry[1]))));
      Object.keys(got).forEach(function (k) {
        var mine = {}, theirs = {};
        try { mine = JSON.parse(localStorage.getItem(k)) || {}; } catch (e) {}
        try { theirs = JSON.parse(got[k]) || {}; } catch (e) {}
        Object.keys(mine).forEach(function (kk) { theirs[kk] = mine[kk]; });
        localStorage.setItem(k, JSON.stringify(theirs));
      });
      history.replaceState(null, "", location.pathname + location.search);
    }
    /* the key that lets this device read and write the board's own marks. It
       is given once, by a link, and kept here; it is never in the page
       (Jose, Sep 19, 2026: "it's just me on the site") */
    var kk = /[#&]key=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (kk) {
      localStorage.setItem("arena.key", kk[1]);
      history.replaceState(null, "", location.pathname + location.search);
    }
  } catch (e) {}
  // Tapping a price marks it; the marks stay on this device.
  var KEY = "ww-picks-2026-09-12";
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  /* the fixture a card is for, written the way the slip groups by it */
  function gameName(card) {
    if (card.dataset.sport === "mma") {
      var ev = card.dataset.event, nm = "";
      if (typeof FIGHTCARDS !== "undefined") {
        FIGHTCARDS.forEach(function (e) { if (e[1] === ev) nm = evTag(e[3]); });
      }
      if (nm) return nm;
    }
    var t = card.querySelectorAll(".ghead .gteam");
    if (t.length === 2) {
      var nm = function (side) {
        var g = side.querySelector(".gabbr"), img = side.querySelector("img.glogo");
        return (g && g.childNodes[0] && g.childNodes[0].nodeValue || "").trim() ||
               (img && img.alt) || side.textContent.replace(/[^A-Za-z& ]/g, "").trim();
      };
      return nm(t[0]) + " @ " + nm(t[1]);
    }
    var f = card.querySelectorAll(".fname, .gfname");
    if (f.length === 2) {
      /* His record sits inside the name, so reading the element whole gave
         back "SHAHBAZYAN16-6 v FERREIRA15-4" -- on the slip, and in the box
         that says what a card paid (Jose, Sep 19, 2026: "why would the record
         come up from the paid modal"). Take a copy, drop the record from it,
         and read the name off that. */
      var bare = function (e) {
        var c = e.cloneNode(true), r = c.querySelector(".frec");
        if (r) r.parentNode.removeChild(r);
        return c.textContent.trim();
      };
      return bare(f[0]) + " v " + bare(f[1]);
    }
    return "";
  }
  /* The bar is drawn a beat after a tap on the board, not on the tap itself.
     A double tap runs the slip twice, on and then off, and drawing on each
     one made the slip slide in and straight back out under his thumb -- which
     is what he was tapping around (Jose, Sep 19, 2026: "its adding the bet
     and then removing it quick"). The button still lights on the tap, so the
     board answers him at once; only the bar waits, and where the two taps
     cancelled out there is nothing left to draw. Anywhere else -- taking a
     leg off inside the slip itself -- draws straight away, because there is
     no second tap coming there. */
  var slipDraw = null;
  function slipSoon() {
    clearTimeout(slipDraw);
    slipDraw = setTimeout(function () { slipDraw = null; slip(); }, 420);
  }
  function setPick(btn, on, soon) {
    var id = btn.dataset.oid;
    btn.classList.toggle("on", on);
    var card = btn.closest(".gcard");
    saved[id] = on ? {o: priceOf(btn), l: labelFor(btn),
                      g: card ? (card.dataset.espn || card.dataset.bout || "") : "",
                      gn: card ? gameName(card) : ""}
                   : undefined;
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    if (typeof pushState === "function") pushState();
    if (soon) slipSoon(); else slip();
  }
  /* Delegated, not bound one by one: most cards are drawn after this runs,
     and a button made later would otherwise have no handler at all. */
  /* Two taps on the same price, inside four hundred milliseconds, is him
     saying he has that one on: it takes a gold edge, and two taps more take
     it off. One tap keeps meaning what it always meant, which is the slip.

     The two taps of a double each run the slip as normal, so the leg goes on
     the slip and straight back off it and the slip ends where it started.
     That is deliberate: the alternative is to hold every single tap for four
     hundred milliseconds to see whether a second one is coming, which would
     make every tap on the board feel slow.

     Nothing here asks whether the game has started. A card that is live or
     finished has every price on it disabled already, and a disabled button
     is never clicked, so this only ever reaches a game still to come
     (Jose, Sep 19, 2026: "it only works for pregame"). */
  /* A price on a game that has kicked off is shut, not disabled: a disabled
     button hears no tap at all, so once a game was on nothing could be
     marked placed or unplaced on it. Shut, it still hears the double tap
     and ignores the single one -- the slip is for games still to come, the
     gold edge is for any time (Jose, Sep 20, 2026: "the double tap should
     work at all times, to select, unselect"). */
  function shutPrice(b) {
    b.dataset.shut = "1";
    b.setAttribute("aria-disabled", "true");
    b.disabled = false;
  }
  var TAPAT = 0, TAPON = null;
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button.price");
    if (!btn) return;
    var shut = btn.dataset.shut === "1";
    var now = Date.now();
    if (TAPON === btn && now - TAPAT < 400) {
      TAPAT = 0; TAPON = null;
      togglePlaced(btn);
      if (shut) { e.preventDefault(); return; }
    } else {
      TAPAT = now; TAPON = btn;
    }
    if (shut) { e.preventDefault(); return; }
    setPick(btn, !btn.classList.contains("on"), true);
  });
  /* And a freshly drawn button has to remember it was already picked. */
  /* what has actually been placed, as against what is marked on the slip.
     Keyed by the book's own selection id, so it survives a rebuild and a
     price move (Jose, Sep 19, 2026) */
  var PLACEDKEY = "odds.placed.v1";
  var placed = {};
  try { placed = JSON.parse(localStorage.getItem(PLACEDKEY) || "{}") || {}; } catch (e) { placed = {}; }
  function markSaved(root) {
    (root || document).querySelectorAll("button.price[data-oid]").forEach(function (b) {
      if (saved[b.dataset.oid]) b.classList.add("on");
      if (placed[b.dataset.oid]) b.classList.add("placed");
    });
  }
  /* On or off, and written to every copy of that leg on the page at once:
     the same price is drawn on the card's own face and again inside the
     market sheet, and marking one and not the other would read as two
     different answers to the same question. */
  function togglePlaced(btn) {
    var oid = btn.dataset.oid;
    if (!oid) return;
    var on = !placed[oid];
    if (on) placed[oid] = true;
    else delete placed[oid];
    document.querySelectorAll("button.price").forEach(function (b) {
      if (b.dataset.oid !== oid) return;
      b.classList.toggle("placed", on);
      if (!on) b.classList.remove("won", "lost", "paid");
    });
    try { localStorage.setItem(PLACEDKEY, JSON.stringify(placed)); } catch (e) {}
    if (typeof placedState === "function") placedState();
    if (typeof pushState === "function") pushState();
  }
  window.togglePlaced = togglePlaced;
  window.shutPrice = shutPrice;
  window.markSaved = markSaved;
  markSaved(document);
  /* ---- Sheets: opening, shutting, and the page held still behind ---- */
  var heldAt = 0;
  var SLIPHOME = null;
  var SLIPRODE = null;
  function slipRide(d) {
    var bar = document.getElementById("slipbar");
    if (!bar || !d || d === document.getElementById("slipsheet")) return;
    if (!SLIPHOME) SLIPHOME = bar.parentNode;
    SLIPRODE = d;
    d.appendChild(bar);
  }
  /* the sheet gives up exactly the bar's height, so the two sit one above the
     other instead of on each other */
  function slipRoom() {}
  window.slipRoom = slipRoom;
  function slipHome() {
    var bar = document.getElementById("slipbar");
    SLIPRODE = null;
    if (bar && SLIPHOME && bar.parentNode !== SLIPHOME) SLIPHOME.appendChild(bar);
  }
  function openSheet(d) {
    if (!d || d.open) return;
    heldAt = window.pageYOffset || document.documentElement.scrollTop || 0;
    document.body.style.top = (-heldAt) + "px";
    document.body.classList.add("sheeted");
    d.showModal();
    slipRide(d);
  }
  function letGo() {
    slipHome();
    if (document.querySelector("dialog.sheet[open]")) return;
    document.body.classList.remove("sheeted");
    document.body.style.top = "";
    window.scrollTo(0, heldAt);
  }
  /* A dialog's close does not bubble, so it is caught on the way down. Every
     way out comes through here — the arrow, Escape, and the pull. */
  document.addEventListener("close", function (e) {
    if (!(e.target.matches && e.target.matches("dialog.sheet"))) return;
    e.target.classList.remove("sheet--dragging", "sheet--settling");
    e.target.style.transform = "";
    letGo();
  }, true);
  document.addEventListener("click", function (e) {
    var hit = e.target.closest("[data-shuts], [data-shut]");
    if (!hit) return;
    var d = hit.hasAttribute("data-shuts")
      ? document.getElementById(hit.getAttribute("data-shuts"))
      : hit.closest("dialog.sheet");
    if (d && d.open) d.close();
  });
  /* the clip stops only when its sheet goes -- not on any tap anywhere, which
     is what the tear-down above used to do */
  (function () {
    var box = document.getElementById("vidsheet"), _v = document.getElementById("vidplay");
    if (!box || !_v) return;
    box.addEventListener("close", function () {
      if (_v._hls) { try { _v._hls.destroy(); } catch (e) {} _v._hls = null; }
      _v.pause(); _v.removeAttribute("src"); _v.removeAttribute("poster"); _v.load();
    });
  })();

  /* ---- Pulling the shut slip open ----
     It sits at the foot of the screen like a sheet that is nearly all the way
     down, so it comes up the way a sheet comes up: a tap, or a pull. It
     follows the finger a little on the way, which is what says it will move. */
  (function () {
    var bar = document.getElementById("slipbar");
    var from = 0, at = 0, began = 0, pulling = false, live = false;

    function settle(open) {
      bar.classList.remove("slipbar--pulling");
      bar.style.transform = "";
      live = false; pulling = false; at = 0;
      if (open) openSheet(document.getElementById("slipsheet"));
    }

    bar.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse") return;
      live = true; from = e.clientY; at = 0; began = Date.now(); pulling = false;
    }, { passive: true });

    bar.addEventListener("pointermove", function (e) {
      if (!live) return;

    bar.addEventListener("pointerup", function () {
      if (!live) return;

    }, { passive: true });

    bar.addEventListener("pointercancel", function () { settle(false); }, { passive: true });

    }, { passive: false });

  /* ---- Pulling a sheet away ----
     Whether a finger moving down means "put this away" or "scroll what is in
     it" is answered by whichever box is actually under the finger, and only
     when that box is already at its top. Nothing here runs on a wide
     window, where a sheet is a centered card instead. */
  (function () {
    var PULL = window.matchMedia("(max-width: 700px)");
    var sheet = null, scroller = null, from = 0, at = 0, began = 0, pulling = false;

    function scrollerUnder(node, within) {

        if (node.scrollHeight > node.clientHeight + 1) {
          var how = getComputedStyle(node).overflowY;
          if (how === "auto" || how === "scroll") return node;
        }
        node = node.parentElement;
      }

    }

      if (!sheet) return;
      var going = sheet;
      going.classList.remove("sheet--dragging");
      going.classList.add("sheet--settling");
      if (said === "away") {
        going.style.transform = "translateY(100%)";
        window.setTimeout(function () {
          going.classList.remove("sheet--settling");
          going.style.transform = "";
          if (going.open) going.close();

      } else {
        going.style.transform = "";

    }

    document.addEventListener("pointerdown", function (e) {
      if (!PULL.matches || e.pointerType === "mouse") return;
      var open = e.target.closest && e.target.closest("dialog.sheet[open]");
      if (!open) return;
      /* a button is a button, and the chart reads under its own finger */
      if (e.target.closest("button, a, input, label, select, textarea, svg")) return;
      sheet = open;
      scroller = scrollerUnder(e.target, open);
      from = e.clientY; at = 0; began = Date.now(); pulling = false;
    }, { passive: true });

    document.addEventListener("pointermove", function (e) {
      if (!sheet) return;

          return;

  /* the school's name for the slip -- "Syracuse", "Coastal Carolina" -- ESPN's

  var CFBNAME = {};
  fetch("cfb_schools.json").then(function (r) { return r.json(); })
    .then(function (j) { CFBNAME = j || {}; slip(); }).catch(function () {});
  function teamLabel(club, card) {
    /* a drawn card names its club only in the logo's alt or the abbreviation span */
    var fn = club.querySelector(".fname");
    if (fn) return (fn.childNodes[0] && fn.childNodes[0].nodeValue || fn.textContent).trim();
    var g = club.querySelector(".gabbr"), img = club.querySelector("img.glogo");
    var ab = (g && g.textContent.trim()) || (img && img.alt) || club.textContent.replace(/[^A-Za-z ]/g, "").trim();
    if (card && card.dataset.lg === "college-football" && CFBNAME[ab]) return CFBNAME[ab];

  /* a fight leg carries the man and the market with a mark between them, so
     nothing has to be picked back out of the words: "SHAHBAZYAN vs FERREIRA
     \u2016 KO RD1 \u00b7 5:30 PM". Everything written before this reads the
     old way still (Jose, Sep 18, 2026). */
  var LEGSPLIT = "\u2016";
  function boutName(card) {
    return String(card.dataset.lf || "").split(" ").pop().toUpperCase() + " vs " +
           String(card.dataset.rf || "").split(" ").pop().toUpperCase();
  }
  function labelFor(btn) {
    var card = btn.closest(".gcard");
    var gt = card ? card.querySelector(".gtime") : null, when = "";
    if (gt) [].forEach.call(gt.childNodes, function (x) { if (x.nodeType === 3 && x.nodeValue.trim() && !when) when = x.nodeValue.trim(); });
    if (gt && !when) {
      var wt = gt.querySelector(".fwt");
      when = gt.textContent.replace(wt ? wt.textContent : "", "").trim().split("\n")[0];
    }
    function done(who, what) {
      return (who + " " + what + " \u00b7 " + when).replace(/\s+/g, " ").trim();
    }
    /* the market may carry a middle dot of its own -- BY KO \u00b7 OTHER NO
       ACTION -- which is why the man is fenced off rather than parsed out */
    function fightDone(who, what, at) {
      /* a bare RD2 in the KO tab is his knockout in round two, so the tab it
         sits under is written into the leg -- the slip has no tabs
         (Jose, Sep 18, 2026) */
      var pane = btn.closest(".tpane");
      var tab = pane ? String(pane.dataset.tab || "") : "";
      if (/^RD[1-5]$/i.test(String(what).trim()) && /^(KO|SUB|FINISH)$/.test(tab)) {
        what = tab + " " + String(what).trim();
      }
      var mkt = String(what).replace(/\s*\u00b7\s*OTHER NO ACTION/i, " ONLY")
                            .replace(/\bONLY\b(.*)\bONLY\b/i, "ONLY$1")
                            .replace(/^BY /i, "").replace(/\s+/g, " ").trim();
      return (String(who).trim() + " " + LEGSPLIT + " " + mkt + " \u00b7 " + at)
        .replace(/\s+/g, " ").trim();
    }
    var teams = card ? card.querySelectorAll(".gteam") : [];
    var lq = card && card.dataset.lqb ? famName(card.dataset.lqb) : "";
    var rq = card && card.dataset.rqb ? famName(card.dataset.rqb) : "";

    /* the moneyline, up in the heading beside its club */
    var club = btn.closest(".gteam");
    if (club) return done(teamLabel(club, card), "ML");

    var cell5 = btn.closest(".fs5cell");
    if (cell5 && card) {

      var what = lab ? lab.textContent.replace(/\s+/g, " ").trim() : "";
      if (!what) what = String(mrow.dataset.mkt || "").toUpperCase();
      var bout = boutName(card);
      /* a row with one price belongs to the fight, not to either man */
      if (mrow.classList.contains("mktrow--wide") || mrow.classList.contains("fway--one") ||

      var who = pane && pane.classList.contains("ptdside--l") ? lq : rq;
      var kind = sec ? (sec.dataset.kind || "PTD") : "PTD";
      var line = chip.querySelector(".ptdline");
      return done(who, (line ? line.textContent.trim() + " " : "") + kind);

    if (h2ho) {

      return done(slots[0] === h2ho ? lq : rq, "H2H");
    }

    if (man) {

      return done(nm ? nm.textContent.replace(/[^A-Za-z.' -]/g, "").trim() : "", "1+ REC 1Q");
    }

    var row = btn.closest(".grow");
    if (row && card) {
      var mk = row.querySelector(".gmk").textContent.trim();
      var cells = row.querySelectorAll(".gcell");
      var left = btn.closest(".gcell") === cells[0];
      var qb = left ? lq : rq;
      var name = qb && mk !== "ML"
        ? qb

  /* What the picks pay together: every price as a decimal, multiplied, and
     turned back into the way a book writes it. */
  function parlay(picks) {
    var p = 1;
    for (var i = 0; i < picks.length; i++) {
      var n = parseInt(String(picks[i].o)
        .replace(/\u2212|\u2013|\u2014/g, "-").replace(/[^\-0-9]/g, ""), 10);
      if (isNaN(n) || n === 0) return "\u2014";
      p *= n > 0 ? 1 + n / 100 : 1 + 100 / -n;
    }
    if (p <= 1) return "\u2014";
    var a = p >= 2 ? Math.round((p - 1) * 100) : -Math.round(100 / (p - 1));
    return (a > 0 ? "+" : "\u2212") + Math.abs(a);
  }

  /* Taking a pick off: the button if it is here, the record either way. */
  function drop(id) {
    var btn = document.querySelector('button.price[data-oid="' +
              String(id).replace(/"/g, '\\"') + '"]');
    if (btn) { setPick(btn, false); return; }
    saved[id] = undefined;
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    if (typeof pushState === "function") pushState();
    slip();
  }

  var slipTab = "parlay";
  function slip() {
    /* Every pick that has been made, whether or not its card is on the board.
       A pick kept from an older visit may have been written before the price
       was, so anything without one is dropped rather than shown blank. */
    var on = [];
    Object.keys(saved).forEach(function (id) {
      var v = saved[id];
      if (!v) return;
      if (v === true) { delete saved[id]; return; }
      var btn = document.querySelector('button.price[data-oid="' + id.replace(/"/g, '\\"') + '"]');
      var card = btn && btn.closest(".gcard");
      var gn = (card && gameName(card)) || v.gn || "";

    });

      /* the count was left at whatever it last read. The bar is hidden so he
         never saw it, but it came back wrong for the moment between the bar

      document.getElementById("slipn").textContent = "0";
      document.getElementById("slipn2").textContent = "0";
      document.getElementById("slippay").textContent = "\u2014";

    }

    document.getElementById("slipn2").textContent = on.length;
    document.getElementById("slippay").textContent = parlay(on);
    var kind = document.getElementById("slipkind");
    if (kind) kind.textContent = on.length > 1 ? "parlay" : "single";

    document.getElementById("sliplink").href = "https://sportsbook.draftkings.com/?outcomes=" + outs;
    document.getElementById("sliplink").textContent = "Add to betslip (" + on.length + ")";
    var list = document.getElementById("sliplist");
    list.innerHTML = "";

    var order = [], byGame = {};

    on.forEach(function (b) {

      byGame[k].push(b);

        var pic = slipPic(who, sportOf(b.g) || (m && m[4] ? "mma" : ""), b.g);

    order.forEach(function (k) {
      var picks = byGame[k];

        (whenOf(picks[0]) ? '<span>\u00b7 ' + esc(whenOf(picks[0])) + "</span>" : "") + "</div>");
      picks.forEach(function (b) { card.appendChild(legRow(b)); });
    });
    var foot = document.createElement("div");
    foot.className = "slfoot";
    foot.innerHTML = "<b>" + on.length + (on.length > 1 ? " legs" : " leg") +
                     "</b><span class=\"slpay\">" + parlay(on) + "</span>";

  }
  /* The slip writes a pick as the board draws it: one football for 1+ PTD,
     two for 2+, the running mark for ATD, the sheet's own marks for how a
     fight ends. The moneyline, head to head and the time stay as words.
     (Jose, Sep 16, 2026.) */
  var SLIPMARK = {
    "KO": "mko", "SUB": "msub", "DEC": "mdec", "KO / SUB": "mko msub", "FINISH": "mko msub",
    "KO / DEC": "mko mdec", "SUB / DEC": "msub mdec", "GOES THE DISTANCE": "mdec",
    "DOESN\u2019T GO THE DISTANCE": "mko msub", "ENDS BY KO": "mko", "ENDS BY SUB": "msub",

  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* ---- how a fight market is drawn, in one place ----
     Every market gets the marks that say it: the glove for a KO, the gi for a
     submission, the judges for a decision, and a rounded square for the round
     and for the rest -- R1 through R5, UD, SD, MD, ITD, GTD, 60, 10, 1-2, 3-4
     and ONLY, the same square the VS mark uses. Whatever the marks do not say
     stays as words (Jose, Sep 18, 2026). */
  var FMARK = [
    [/\bFINISH\b/, "mko msub"], [/\bKO\b/, "mko"], [/\bSUB\b/, "msub"],
    [/\bUD\b/, "mud"], [/\bSD\b/, "msd"], [/\bMD\b/, "mmd"],
    [/\bDEC\b/, "mdec"], [/\bGTD\b|GOES THE DISTANCE/, "gtd"],
    [/\bINSIDE\b/, "itd"], [/\bRD1-2\b/, "dc12"], [/\bRD3-4\b/, "dc34"],
    [/\bRD([1-5])\b/, "r$1"], [/\b60\b/, "s60"], [/\b10\b/, "s10"]
  ];

  var FFILL = /^(ANY|BY|OR|THE|SEC|1ST|LAST|RD|\/|\u00b7|AND)$/;
  function fightSay(what) {
    var t = String(what || "").toUpperCase().replace(/\s+/g, " ").trim();
    if (!t) return {marks: "", words: what || ""};
    if (t === "WINS ON THE CARDS") {
      return {marks: '<i class="slmk slmk--m"><svg aria-hidden="true">' +
                     '<use href="#mdec"/></svg></i>', words: ""};
    }
    var found = [], used = {};
    FMARK.forEach(function (rule) {
      var m = rule[0].exec(t);
      if (!m) return;
      var key = rule[1].replace("$1", m[1] || "");
      if (used[key] || (/^r[1-5]$/.test(key) && (used.dc12 || used.dc34))) return;
      used[key] = 1;
      found.push([m.index, key, m[0]]);

    if (!found.length) return {marks: "", words: what || ""};
    /* in the order the market writes them: KO then R1, R5 then DEC */
    found.sort(function (a, b) { return a[0] - b[0]; });
    var said = {};
    found.forEach(function (f) { f[2].split(/[\s\/]+/).forEach(function (w) { said[w] = 1; }); });
    var rest = t.split(" ").filter(function (w) {
      return !said[w] && !FFILL.test(w);
    }).join(" ");
    var marks = "";
    found.forEach(function (f) {
      f[1].split(" ").forEach(function (k) {
        marks += '<i class="slmk slmk--m"><svg aria-hidden="true"><use href="#' + k + '"/></svg></i>';
      });
    });
    return {marks: marks, words: rest};
  }

  /* [ , who, what, when, fight? ] -- a fight leg is fenced, everything else

          var scale = parseInt(t.dataset.scale, 10) || (isPTD ? 4 : 3);
          t.querySelector(".trkfill").style.width =
            (Math.min(v, scale) / scale * 100).toFixed(0) + "%";
          var counter = t.querySelector(".trkbox");
          counter.textContent = v;
          counter.classList.toggle("hit", v >= need);
          var tk = t.querySelector(".tick");
          if (tk) tk.classList.toggle("hit", v >= need);
        });

        /* the section is .h2hx — it was rebuilt under that name and this
           lookup was never moved, so the whole block sat dead */
        var h = card.querySelector(".h2hx") || card.querySelector(".h2h");
        if (h && stats.l && stats.r && stats.l.pyds !== null && stats.r.pyds !== null) {
          var lv = stats.l.pyds, rv = stats.r.pyds, gap = lv - rv;
          var span = Math.max(Math.abs(gap), 60);
          var half = Math.min(Math.abs(gap) / span * 50, 50);
          var fill = h.querySelector(".h2hfill"), tick = h.querySelector(".h2htick");
          /* the lead rides the tick as a chip ("+38"); it is made once and then
             moved. No face on the bar any more -- the faces are on the name line

          var face = h.querySelector(".h2hchip");
