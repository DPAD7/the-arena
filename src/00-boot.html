<script>
/* the star S in its tile on black from the very first paint (Jose, Oct 13,
   2026; it was the stack of plates and the $), until the board is
   drawn and every picture on screen has arrived (Jose, Sep 23, 2026: "it
   should open once the images and page is loaded completely, not before") */
(function () {
  /* a reload the board did itself, for new code, opens straight on the
     board: the stack is for opening the app, not for an update (Jose, Sep 29,
     2026: "shouldn't it just refresh without the animation again?") */
  var quiet = false;
  try { quiet = sessionStorage.getItem("arena.quiet") === "1"; sessionStorage.removeItem("arena.quiet"); } catch (e) {}
  if (quiet) { var b0 = document.getElementById("boot"); if (b0) b0.remove(); return; }
  /* opened from the home screen the page starts under the status bar, so its
     middle is lower than the screen's: lift the mark by half the difference,
     so it sits in the middle of the glass (Jose, Sep 23, 2026) */
  try {
    var im = document.querySelector("#boot .btile"), gap = screen.height - innerHeight;
    if (im && gap > 0 && gap < 120) im.style.transform = "translateY(" + (-gap / 2) + "px)";
  } catch (e) {}
  /* it opens on the events themselves, not a look every 80 ms: the $ ending
     its animation (and a beat on the finished stack), the page's load, and
     each picture on screen arriving. Ten seconds and it opens regardless
     (Oct 12, 2026; the animation is unchanged) */
  var b = document.getElementById("boot"), done = false, built = false, loaded = document.readyState === "complete";
  var out = function () {
    if (done || !b) return;
    done = true;
    b.classList.add("boot--out"); setTimeout(function () { b.remove(); }, 400);
  };
  var check = function () {
    if (done || !built || !loaded) return;
    var d = document.getElementById("board");
    if (!d || !d.children.length) {
      if (d && !check.mo) { check.mo = new MutationObserver(check); check.mo.observe(d, { childList: true }); }
      return;
    }
    if (check.mo) { check.mo.disconnect(); check.mo = null; }
    var vh = innerHeight, imgs = d.querySelectorAll("img"), wait = 0;
    for (var k = 0; k < imgs.length; k++) {
      var r = imgs[k].getBoundingClientRect();
      if (r.bottom > 0 && r.top < vh && r.width && !imgs[k].complete) {
        wait++;
        if (!imgs[k]._bootw) {
          imgs[k]._bootw = 1;
          imgs[k].addEventListener("load", check, { once: true });
          imgs[k].addEventListener("error", check, { once: true });
        }
      }
    }
    if (!wait) out();
  };
  /* the mark always lands whole before the board opens, never rushed: the
     tile, the star, its shadow, and a beat on it (Jose, Oct 13, 2026) */
  var dollar = b && b.querySelector(".bd");
  if (dollar) dollar.addEventListener("animationend", function () {
    setTimeout(function () { built = true; check(); }, 400);
  }, { once: true });
  else built = true;
  if (!loaded) addEventListener("load", function () { loaded = true; check(); }, { once: true });
  setTimeout(out, 10000);
})();
</script>
