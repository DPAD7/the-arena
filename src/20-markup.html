<script>

  /* Which card a control belongs to. Normally it is the card it sits in --
     but a sheet is lifted out to the body when it opens, so that no card's
     own containing block decides where it lands, and a price inside an open
     sheet has no card above it any more. The sheet remembers the card it
     came from, and everything asks here rather than walking the tree
     (Jose, Sep 22, 2026). */
  function cardOf(el) {
    if (!el || !el.closest) return null;
    return el.closest(".gcard") || (el.closest("dialog.sheet") || {})._card || null;
  }
  window.cardOf = cardOf;

  /* carried in from the old address: sports-odds.pages.dev reads its own
     browser's picks and hidden list, sends them here on the hash once, and
     they are folded into this browser's before anything reads them. What is
     already here wins; the hash is dropped so a reload does not do it twice
     (Jose, Sep 18, 2026: "why would I open the old when I don't want to use
     the old") */
  try {
    var carry = /^#carry=(.+)$/.exec(location.hash);
    if (carry) {
      var got = JSON.parse(decodeURIComponent(escape(atob(carry[1]))));
      Object.keys(got).forEach(function (k) {
        var mine = {}, theirs = {};
        try { mine = JSON.parse(localStorage.getItem(k)) || {}; } catch (e) {}
        try { theirs = JSON.parse(got[k]) || {}; } catch (e) {}
        Object.keys(mine).forEach(function (kk) { theirs[kk] = mine[kk]; });
        localStorage.setItem(k, JSON.stringify(theirs));
      });
      history.replaceState(null, "", location.pathname + location.search);
    }
    /* the key that lets this device read and write the board's own marks. It
       is given once, by a link, and kept here; it is never in the page
       (Jose, Sep 19, 2026: "it's just me on the site") */
    var kk = /[#&]key=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (kk) {
      localStorage.setItem("arena.key", kk[1]);
      history.replaceState(null, "", location.pathname + location.search);
    }
  } catch (e) {}
  // Tapping a price marks it; the marks stay on this device.
  var KEY = "ww-picks-2026-09-12";
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  /* the fixture a card is for, written the way the slip groups by it */
  function gameName(card) {
    if (card.dataset.sport === "mma") {
      var ev = card.dataset.event, nm = "";
      if (typeof FIGHTCARDS !== "undefined") {
        FIGHTCARDS.forEach(function (e) { if (e[1] === ev) nm = evTag(e[3]); });
      }
      if (nm) return nm;
    }
    var t = card.querySelectorAll(".ghead .gteam");
    if (t.length === 2) {
      var nm = function (side) {
        var g = side.querySelector(".gabbr"), img = side.querySelector("img.glogo");
        return (g && g.childNodes[0] && g.childNodes[0].nodeValue || "").trim() ||
               (img && img.alt) || side.textContent.replace(/[^A-Za-z& ]/g, "").trim();
      };
      return nm(t[0]) + " @ " + nm(t[1]);
    }
    var f = card.querySelectorAll(".fname, .gfname");
    if (f.length === 2) {
      /* His record sits inside the name, so reading the element whole gave
         back "SHAHBAZYAN16-6 v FERREIRA15-4" -- on the slip, and in the box
         that says what a card paid (Jose, Sep 19, 2026: "why would the record
         come up from the paid modal"). Take a copy, drop the record from it,
         and read the name off that. */
      var bare = function (e) {
        var c = e.cloneNode(true), r = c.querySelector(".frec");
        if (r) r.parentNode.removeChild(r);
        return c.textContent.trim();
      };
      return bare(f[0]) + " v " + bare(f[1]);
    }
    return "";
  }
  /* The bar is drawn a beat after a tap on the board, not on the tap itself.
     A double tap runs the slip twice, on and then off, and drawing on each
     one made the slip slide in and straight back out under his thumb -- which
     is what he was tapping around (Jose, Sep 19, 2026: "its adding the bet
     and then removing it quick"). The button still lights on the tap, so the
     board answers him at once; only the bar waits, and where the two taps
     cancelled out there is nothing left to draw. Anywhere else -- taking a
     leg off inside the slip itself -- draws straight away, because there is
     no second tap coming there. */
  var slipDraw = null;
  /* ---- what could sink a leg, said the moment it goes on the slip ----
     build/alerts.py keeps each game's forecast, spread and injuries in
     alerts.json. Adding a leg checks five things and says whichever apply;
     the leg goes on regardless (Jose, Sep 26, 2026: Grunkemeyer 2+ PTD in the
     rain at BC, "if I add something to the betslip ... an alert saying this
     to consider"). */
  var ALERTS = null;
  /* each club's five up front and its defense, and who of them is hurt */
  var ALERTLU = {};
  /* What can sink a passer's legs in his club's next game, for the search card
     and the Form card (Jose, Sep 29, 2026: "they should also be on the search
     ... and on the stack button"): the same rules the leg alert keeps for a
     passing leg -- a teammate with 15% of the targets or a quarter of the
     touchdown catches, a starting lineman down, his own mark, the weather.
     [{tag, who, say, why}] */
  /* a club's defensive starters out or questionable, off the lineup: every
     one of them, or only the ones who cover and rush the passer */
  function defDown(gid, club, passOnly) {
    var lu = (typeof ALERTLU === "object" && ALERTLU[String(gid)] || {})[club];
    return ((lu && lu.def) || []).filter(function (m) {
      if (m.s !== "out" && m.s !== "q") return false;
      return !passOnly || /^(CB|S|DE)$/.test(m.p) || /cb|ss|fs|de/.test(m.k);
    }).map(function (m) {
      return (m.p || String(m.k).toUpperCase()) + " " + (m.was || m.nm) + (m.s === "out" ? " out" : " questionable");
    });
  }
  window.defDown = defDown;
  function qbRisks(club, qbId, qbName) {
    var now = Date.now(), g = null;
    (typeof SCHED === "object" ? SCHED : []).forEach(function (r) {
      var t = Date.parse(r[2]);
      if (t < now - 5 * 3600000 || (r[3] !== club && r[4] !== club)) return;
      if (!g || t < Date.parse(g[2])) g = r;
    });
    if (!g || !ALERTS) return [];
    var a = ALERTS[String(g[1])] || {}, out = [];
    /* only the man the card names for that game: a benched passer's club
       news is not his */
    var onCard = String(g[3] === club ? g[6] : g[8]);
    if (qbId && onCard !== String(qbId)) return [];
    var qn = famName(qbName || (g[3] === club ? g[5] : g[7])) || "him";
    var TAG = { "Out": "OUT", "Injured Reserve": "IR", "Doubtful": "D", "Questionable": "Q", "Suspension": "SUSP" };
    var h = typeof WIRE === "object" ? WIRE[String(qbId)] : null;
    if (h && h.status && TAG[h.status]) out.push({ tag: TAG[h.status], who: qn, say: qn + " is " + h.status.toLowerCase() + (h.type ? " (" + String(h.type).toLowerCase() + ")" : "") + ".", why: "If he doesn't take the snaps, the leg is dead." });
    (a.out || []).forEach(function (x) {
      if (x.team !== club || x.pos === "QB" || x.sh == null) return;
      if (!(x.tsh >= 0.15 || (x.tds >= 2 && x.rtd * 4 >= x.tds))) return;
      var lo = Math.floor(x.tg), hi = Math.ceil(x.tg);
      var tgs = (lo === hi ? "about " + lo : lo + " to " + hi) + " " + (x.tgw || "targets");
      var ifs = /Questionable|Doubtful/.test(x.status) ? "If he sits, tougher" : "Tougher";
      out.push({ tag: TAG[x.status] || x.status, who: famName(x.name) || x.name,
                 say: x.name + " (" + x.pos + ") is " + x.status.toLowerCase().replace("injured reserve", "on injured reserve") + ".",
                 why: "Usually gets " + tgs + " and " + (x.ryd || 0) + " yards a game" + (x.tds ? ", caught " + (x.rtd || 0) + " of " + x.team + "'s " + x.tds + " TD passes" : "") +
                      ". " + ifs + " for " + qn + " to throw his." });
    });
    var lu = (typeof ALERTLU === "object" && ALERTLU[String(g[1])] || {})[club];
    var SPOT = { lt: "LT", lg: "LG", c: "C", rg: "RG", rt: "RT" };
    ((lu && lu.off) || []).forEach(function (m) {
      if (!SPOT[m.k] || (m.s !== "out" && m.s !== "q")) return;
      var nm = m.was || m.nm;
      out.push({ tag: m.s === "out" ? "OUT" : "Q", who: SPOT[m.k] + " " + String(nm).replace(/^([A-Z]\.\s*)+/, ""),
                 say: club + " " + SPOT[m.k] + " " + nm + (m.s === "out" ? " is out" + (m.was && m.nm ? ", " + m.nm + " in" : "") : " is questionable") + ".",
                 why: "Less time to throw and fewer holes near the goal line." });
    });
    var opp = g[3] === club ? g[4] : g[3], dd = defDown(g[1], opp, true);
    if (dd.length) out.push({ tag: "DEF", who: opp + " D", say: opp + " defense: " + dd.join("; ") + ".",
                              why: "Fewer of their starters covering and rushing: easier for " + qn + " to throw." });
    var w = a.wx || {};

     keeps them (build/boxing.py) */
  if (typeof BOXFPROPS === "object") Object.keys(BOXFPROPS).forEach(function (k) { FPROPS[k] = BOXFPROPS[k]; });
  /* ---- a bout's markets, in three tabs ----
     How it ends carries the five chips -- KO, SUB, DEC, FINISH, DBL CHANCE --
     and a selection may sit under more than one of them, because the chips are
     a way of looking rather than a filing cabinet: "any finish" is a KO bet and
     a submission bet at the same time (Jose, Sep 18, 2026).

     How long and Skill are the two we hold nothing for yet. They are drawn
     empty rather than hidden, so what is missing is visible. */
  document.addEventListener("click", function (e) {
    var t = e.target.closest(".mtab[data-tab]");
    if (t) {
      var sheet = t.closest(".sheet__scroll") || t.parentNode.parentNode;
      sheet.querySelectorAll(".mtab[data-tab]").forEach(function (x) {
        x.classList.toggle("on", x === t);
      });
      sheet.querySelectorAll(".tpane[data-tab]").forEach(function (p) {
        p.classList.toggle("off", p.dataset.tab !== t.dataset.tab);
      });
      return;
    }
    var c = e.target.closest(".chip[data-chip]");
    if (!c) return;
    var pane = c.closest(".tpane");
    if (!pane) return;
    pane.querySelectorAll(".chip[data-chip]").forEach(function (x) {
      x.classList.toggle("on", x === c);
    });
    pane.querySelectorAll(".cpane[data-chip]").forEach(function (p) {
      p.classList.toggle("off", p.dataset.chip !== c.dataset.chip);
    });
  });

  function fsRow(k, lab, marks) {
    var mk = marks.map(function (m) {
      return '<svg aria-hidden="true"><use href="#' + m + '"/></svg>';
    }).join("");
    return '<div class="mktrow" data-mkt="' + k + '">' + fs(k, 0) +
      '<span class="mktlab"><span class="mktmk">' + mk + '</span>' + lab + '</span>' +
      fs(k, 1) + '</div>';
  }
  function fsOne(k, lab, marks) {
    var pr = (FPROPS[FS_BOUT] || {})[k], slot = (pr || [])[0];
    var mk = marks.map(function (m) {
      return '<svg aria-hidden="true"><use href="#' + m + '"/></svg>';
    }).join("");
    return '<div class="mktrow mktrow--one" data-mkt="' + k + '">' +
      '<span class="mktlab"><span class="mktmk">' + mk + '</span>' + lab + '</span>' +
      (slot && slot[0] ? priceSlot(slot[0], slot[1]) : GHOST) + '</div>';
  }
  /* Every market a bout can carry, whether or not we hold a price for it.
     A row we have nothing for is drawn as a dash rather than left out, so the
     shape of the sheet is the shape of the market and the gaps are visible
     (Jose, Sep 18, 2026). The keys are the eleven slots fill_fights.py stores;
     everything else waits on a wider read. */
  /* Every market a bout can carry, whether or not we hold a price for it.
     A row we have nothing for is drawn as a dash rather than left out, so the
     shape of the sheet is the shape of the market and the gaps are visible
     (Jose, Sep 18, 2026).

     How many rounds the bout goes decides how many rows there are: a
     three-round fight has no RD4, and its last round is the one that pairs
     with the cards. fill_fights.py reads that off what DraftKings offers and
     writes it as "rounds". */
  function fsRows(nr) {
    function byRound(key, lab) {
      var out = [];
      for (var n = 1; n <= nr; n++) out.push([key + n, "RD" + n, lab, 2]);
      return out;
    }
    function cells(pre, key) {
      var out = [];
      for (var n = 1; n <= nr; n++) out.push([pre + " RD" + n, key + n]);
      return out;
    }
    /* boxing: only what DraftKings sells on a bout. Winning a round is a
       stoppage there, so the rounds sit under KO; no submissions, no UD or
       split, no double chance (Jose, Sep 26, 2026: "will we ever get those
       markets for Zuffa") */
    if (/^zb-/.test(String(FS_BOUT))) {
      var bp = FPROPS[FS_BOUT] || {};
      var groups = Object.keys(bp).filter(function (k) { return /^rg\d+-\d+$/.test(k); })
        .sort(function (x, y) { return parseInt(x.slice(2), 10) - parseInt(y.slice(2), 10); })
        .map(function (k) { return [k, "RD" + k.slice(2), ["mko"], 2]; });
      return {
        "KO": [["ko", "BY KO", ["mko"], 2]].concat(byRound("rd", ["mko"])),
        "DEC": [["dec", "BY DEC", ["mdec"], 2],
                [null, "", ["mdec"], 5, [["GTD", "dist"], ["DRAW", "draw"]]]],
        "FINISH": groups.concat([[null, "", ["mko"], 5, [["INSIDE", "nodist"]]]])
      };
    }
    var R = {
      "KO": [["ko", "BY KO", ["mko"], 2],
             ["koonly", "BY KO ONLY", ["mko"], 2]]
        .concat(byRound("kord", ["mko"]))
        .concat([[null, "", ["mko"], 5, [["ANY KO", "anyko"]].concat(cells("KO", "anykord"))]]),
      "SUB": [["sub", "BY SUB", ["msub"], 2],
              ["subonly", "BY SUB ONLY", ["msub"], 2]]
        .concat(byRound("subrd", ["msub"]))
        .concat([[null, "", ["msub"], 5, [["ANY SUB", "anysub"]].concat(cells("SUB", "anysubrd"))]]),
      "DEC": [
        ["sdmd", "SD / MD", ["mdec"], 2],
        ["dec", "BY DEC", ["mdec"], 2],
        ["deconly", "BY DEC ONLY", ["mdec"], 2],
        ["cards", "WINS ON THE CARDS", ["mdec"], 2],
        ["ud", "UD", ["mdec"], 2],
        [null, "", ["mdec"], 5, [["BY DEC", "anydec"], ["BY UD", "anyud"], ["GTD", "dist"]]]
      ],
      "FINISH": [
        ["rd1only", "RD1 ONLY", ["mko", "msub"], 2],
        ["finishonly", "FINISH ONLY", ["mko", "msub"], 2]
      ].concat(byRound("rd", ["mko", "msub"]))
       .concat([[null, "", ["mko", "msub"], 5,
                 [["INSIDE", "nodist"], ["1ST 60 SEC", "first60"], ["LAST 10 SEC ANY RD", "last10"]]]]),
      "DBL CHANCE": [
        ["kodec", "KO / DEC", ["mko", "mdec"], 2],
        ["subdec", "SUB / DEC", ["msub", "mdec"], 2],
        ["kosub", "KO / SUB", ["mko", "msub"], 2],
        ["rd12", "RD1-2", ["mko", "msub"], 2]
      ]
    };
    if (nr === 5) R["DBL CHANCE"].push(["rd34", "RD3-4", ["mko", "msub"], 2]);
    R["DBL CHANCE"].push(["rdlastdec", "RD" + nr + " OR DEC", ["mdec"], 2]);
    /* a boxing bout: no submission rows, and no belt beside the glove */
    if (/^zb-/.test(String(FS_BOUT))) {
      delete R.SUB;
      R["DBL CHANCE"] = R["DBL CHANCE"].filter(function (r) { return r[0] !== "subdec" && r[0] !== "kosub"; });
      Object.keys(R).forEach(function (k) {
        R[k].forEach(function (r) { if (r[2]) r[2] = r[2].filter(function (m) { return m !== "msub"; }); });
      });
    }
    return R;
  }
