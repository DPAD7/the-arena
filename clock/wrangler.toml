# The board's clock: one Durable Object holding one alarm, set to the next
# moment that matters (clock.js). The daily cron only re-arms it.
name = "arena-clock"
main = "clock.js"
compatibility_date = "2026-01-01"
workers_dev = false

[[durable_objects.bindings]]
name = "CLOCK"
class_name = "Clock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Clock"]

[triggers]
crons = ["37 12 * * *"]   # off the hour: at 13:00 it landed on the 9 AM sweep and started a second one

# his DraftKings slips, which the wallet keeps in the board's store
[[kv_namespaces]]
binding = "ARENA"
id = "1bdd65972c8f48a2b9650e5f853c9f4f"
