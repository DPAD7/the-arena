# The mender (Jose, Sep 30, 2026): an issue labeled "fault" (filed by
# watch.yml from a failed run) sets Claude on the repo to find the cause, fix
# it under CLAUDE.md's rules, prove it and ship it. It runs on his Claude
# subscription: the one-time step is `claude setup-token` on his Mac and the
# token saved as the CLAUDE_CODE_OAUTH_TOKEN secret. Without the secret the
# job stands down and the issue waits for a hand.
name: mend

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "the fault issue's number"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: mend
  cancel-in-progress: false

jobs:
  mend:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'fault')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Is the key here
        id: gate
        env:
          KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$KEY" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "no CLAUDE_CODE_OAUTH_TOKEN: the issue waits for a hand"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.has == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.has == 'true'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.has == 'true'
        # chromium alone, without the system packages: the full browser set
        # with its packages took the first run more than ten minutes
        run: pip install --quiet curl_cffi cryptography playwright pynacl && python -m playwright install chromium >/dev/null 2>&1 || true
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.has == 'true'
        with:
          node-version: "20"
      - name: Mend
        if: steps.gate.outputs.has == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASK_SECRET: ${{ secrets.ASK_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # so `gh issue view` and `gh issue comment` work in its shell
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: "--max-turns 60 --allowedTools Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            You are mending the board (read CLAUDE.md first; every rule there holds). A run failed and
            build/triage.py filed it as issue #${{ github.event.issue.number || inputs.issue }} in this repo.
            Read the issue with `gh issue view` (the traceback, the script, the commit). Find the cause in the
            code, never guess: read the script and the data it read. Fix the cause, not the symptom. Prove it:
            run the script dry where it has a dry mode, rebuild the page
            (`cd build && python3 -c "import pagefile; pagefile.deployable(pagefile.read())"`), and run
            `python3 build/guard.py`. If the fix holds, ship with `build/ship.sh "<one line on what it was>"`
            and close the issue with that same line as a comment. If it needs Jose (a login, a secret, a
            decision), say exactly what in a comment and leave the issue open. Always end by commenting on the
            issue with `gh issue comment`, even when there was nothing to mend. Never print a cookie or a secret.
