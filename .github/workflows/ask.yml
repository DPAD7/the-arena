# The double tap: the prices a card is missing, asked for there and then.
#
# site/functions/ask.js starts this when the board is double tapped, with the
# games in front of him. It reads only those games from DraftKings, with the
# same code the sweep prices them by, and posts what it found back to the
# site, which keeps it and hands it to the page (Jose, Sep 23, 2026).
#
# The reading writes no file, so it does not wait
# behind the sweep: it has a concurrency group of its own. The save job below
# folds what it read into site/prices at once (build/ask_fold.py).
name: ask
# the site finds this run by its name when GitHub does not hand back its number
run-name: ask ${{ inputs.key }}

on:
  workflow_dispatch:
    inputs:
      games:
        description: "ESPN game or bout ids, comma separated"
        required: true
      key:
        description: "the tap's key, which the page polls /ask by"
        required: true

concurrency:
  group: ask-${{ inputs.key }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # only what the reading needs: the scripts, the register and the pins,
      # and the page at the root for its schedule. site/ is two hundred
      # megabytes and nothing here reads it
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            build
            data
            src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ask.yml

      - name: What the script needs
        run: pip install --quiet curl_cffi

      - name: Ask
        env:
          ASK_SECRET: ${{ secrets.ASK_SECRET }}
          GAMES: ${{ inputs.games }}
          KEY: ${{ inputs.key }}
        run: python build/ask_dk.py --games "$GAMES" --key "$KEY"

  # and what it read is saved there and then: folded into the price files,
  # deployed, and kept in the repo, so a price a tap fetched is still on the
  # card after a reload -- not only after the next full sweep (Jose, Sep 23,
  # 2026: "why isn't it instant save after I get it... I shouldn't have to do
  # anything else"). It writes the same files the sweep does, so it queues
  # behind a running sweep rather than beside it.
  save:
    needs: ask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: sweep
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fold the tap into the files, and deploy
        env:
          ASK_SECRET: ${{ secrets.ASK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python build/ask_fold.py

      - name: Keep what it wrote
        run: |
          git config user.name "the arena"
          git config user.email "185117539+DPAD7@users.noreply.github.com"
          git add site/prices.json site/prices
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "tap $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
